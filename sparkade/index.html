<style>

--sw-e1:clamp(0px,calc((var(--sw-unit) - var(--sw-r1,9) * var(--sw-spread)) * 20),calc(var(--sw-k1,0) * var(--sw-unit)));--sw-e2:clamp(0px,calc((var(--sw-unit) - var(--sw-r2,9) * var(--sw-spread)) * 20),calc(var(--sw-k2,0) * var(--sw-unit)));
position:absolute;left:calc(50% + var(--sw-ox,0) * var(--sw-spread));top:min(calc(var(--sw-back) + var(--sw-t,1) * (var(--sw-front) - var(--sw-back)) - var(--sw-k,0) * var(--sw-unit)),calc(var(--sw-back) + var(--sw-t1,var(--sw-t,1)) * (var(--sw-front) - var(--sw-back)) - var(--sw-e1)),calc(var(--sw-back) + var(--sw-t2,var(--sw-t1,var(--sw-t,1))) * (var(--sw-front) - var(--sw-back)) - var(--sw-e1) - var(--sw-e2)));width:var(--sw-box);height:var(--sw-box);
margin:calc(var(--sw-box) * -.97) 0 0 calc(var(--sw-box) / -2);padding:0;border:0;outline:0;overflow:visible;pointer-events:none}
.student:before{content:"";position:absolute;z-index:calc(var(--sw-zz) * 3);left:24%;right:24%;top:2%;bottom:0;pointer-events:auto}
.student .sw-figure{position:absolute;z-index:calc(var(--sw-zz) * 3);inset:0;display:block;pointer-events:none;transform-origin:50% 97%;transition:filter .18s}

.sw-petshadow{left:calc(50% + var(--sw-side) * 42%);width:25%;height:6%;z-index:1}

.sw-ring{position:absolute;left:50%;bottom:3%;width:64%;height:17%;transform:translate(-50%,50%);border-radius:50%;border:2px solid #F3D58A;box-shadow:0 0 18px 5px #f3d58a80,inset 0 0 12px #f3d58a73;opacity:0;transition:opacity .2s;z-index:2;pointer-events:none}
.student:focus-visible .sw-ring{opacity:1}

.student .scene-pet{--sw-pw:46%;position:absolute;left:calc(50% + var(--sw-side) * var(--sw-at,42%) - var(--sw-pw) / 2);bottom:2%;width:var(--sw-pw);aspect-ratio:1;z-index:calc(var(--sw-zz) * 3 + 1);pointer-events:auto;transform-origin:50% 98%;
animation:var(--sw-pet-idle,sw-sway 3.6s ease-in-out infinite);animation-delay:var(--delay,0s)}

.student-label>strong{display:block;font-weight:900;font-size:max(13px,calc(var(--sw-box) * .078));line-height:1.1;color:#fff;text-shadow:0 1px 0 #00000099,0 2px 10px #000c}

.student.selected .student-sparkles{background:#080e24b8;box-shadow:0 0 0 2px #f3d58ae6,0 0 26px #f3d58a8c}
.student.selected .student-label>strong{text-shadow:0 1px 0 #00000099,0 2px 10px #000c,0 0 16px #f3d58acc}

.home-world .student{left:50%;top:80%;--sw-box:min(46vh,440px)}

.teacher-announcement{position:absolute;z-index:10;left:50%;top:var(--sw-cloth-top);transform:translateX(-50%);width:clamp(300px,36%,760px);padding-top:clamp(26px,3.4vh,44px);color:#3A2A0A;text-align:left;font-family:var(--sw-font);pointer-events:none;transition:width .3s ease-out}
.cloth-rope{position:absolute;top:0;width:2px;height:calc(clamp(26px,3.4vh,44px) + 3px);background:linear-gradient(#8a6a3a,#5a4222)}
.cloth-rope.l{left:9%}.cloth-rope.r{right:9%}
.cloth-rod{position:relative;z-index:1;display:block;height:12px;margin:0 5%;border-radius:6px;background:linear-gradient(180deg,#9A6B3A,#5E3F1C);box-shadow:0 3px 6px #00000080}
.cloth-fabric{margin:-2px 7% 0;padding:clamp(9px,1.2vw,18px) clamp(14px,1.6vw,28px) clamp(11px,1.4vw,22px);border-radius:0 0 22px 22px;background:linear-gradient(180deg,#FBF1D9,#EBD6A6);box-shadow:inset 0 -6px 0 #7850141f,0 18px 30px #00000073;transform:perspective(1100px) rotateX(7deg);transform-origin:top center;pointer-events:auto}

.announcement-toggle{position:absolute;z-index:2;right:calc(7% + 12px);top:calc(clamp(26px,3.4vh,44px) + 8px);width:34px;height:24px;display:grid;place-items:center;border-radius:0 0 10px 10px;background:linear-gradient(180deg,#7A5226,#5E3F1C);color:#F7EBD0;box-shadow:0 3px 6px #00000059;pointer-events:auto}
.announcement-toggle svg{width:16px;height:16px;transform:rotate(180deg);transition:transform .25s}
.announcement-toggle:focus-visible{outline:2px solid #F3D58A;outline-offset:2px}
.teacher-announcement.collapsed{width:clamp(220px,18%,340px)}
.teacher-announcement.collapsed .cloth-fabric{padding-top:7px;padding-bottom:9px}
.teacher-announcement.collapsed .cloth-fabric p{display:none}
.teacher-announcement.collapsed .announcement-toggle svg{transform:none}

.class-meter{display:flex;align-items:center;gap:14px;padding:0;border:0;background:none;text-align:left;font-family:var(--sw-font,inherit);color:inherit}
.crest-medal{width:64px;height:64px;flex-shrink:0;filter:drop-shadow(0 6px 10px #00000080);transition:transform .2s}
.crest-text{display:block;min-width:0}
.crest-text b{display:block;font-weight:900;font-size:20px;line-height:1.1}
.crest-text small{display:block;margin-top:4px;font-weight:800;font-size:14px}
.world .class-meter{position:absolute;z-index:8;left:var(--sw-crest-left);top:var(--sw-crest-top);max-height:96px;max-width:min(44%,520px);color:#fff}
.world .crest-medal{width:clamp(48px,3.4vw,64px);height:clamp(48px,3.4vw,64px)}
.world .crest-text b{font-size:clamp(17px,1.4vw,26px);color:#fff;text-shadow:0 1px 0 #00000099,0 2px 12px #000000bf}
.world .crest-text small{font-size:clamp(12px,.95vw,18px);color:#F7EBD0e6;text-shadow:0 1px 0 #00000099,0 2px 12px #000000bf}
.world .class-meter:hover .crest-medal{transform:scale(1.05)}
.world .class-meter:focus-visible{outline:2px solid #F3D58A;outline-offset:6px;border-radius:40px}

@media(max-width:640px),(max-width:1100px) and (orientation:portrait){
.world:not(.home-world){--sw-unit:clamp(92px,28vw,118px);--sw-prow-h:calc(var(--sw-unit) + 58px);--sw-ptop:236px;--sw-pbottom:92px;--sw-door:30vh;--sw-cloth-top:78px;--sw-crest-top:12px;--sw-crest-left:14px;
--sw-ptop-eff:max(var(--sw-ptop),calc(100dvh - var(--sw-pbottom) - var(--sw-prows,1) * var(--sw-prow-h)));position:absolute;inset:0 0 auto;height:max(100dvh,calc(var(--sw-ptop) + var(--sw-prows,1) * var(--sw-prow-h) + var(--sw-pbottom)))}
.world:not(.home-world) .student{--sw-box:var(--sw-unit);--sw-side:var(--sw-pside,1);--sw-at:38%;--sw-zz:var(--sw-pz,10);left:var(--sw-px,50%);top:calc(var(--sw-ptop-eff) + var(--sw-prow,0) * var(--sw-prow-h) + var(--sw-unit) * .97)}
.world:not(.home-world) .student-label>strong{font-size:16px}
.world:not(.home-world) .student-sparkles{font-size:14px}
.world:not(.home-world) :is(.world-backdrop,.sky-overlay,.stars,.birds,.sw-legible,.weather,.fireflies,.hatch-stage,.confetti,.fireworks){position:fixed}
.teacher-announcement{width:90%}
.teacher-announcement.collapsed{width:min(260px,70%)}
.cloth-fabric p{font-size:15px}
.cloth-fabric small{font-size:10px}
.world .class-meter{gap:10px;max-width:calc(100% - 120px)}
.world .crest-medal{width:48px;height:48px}
.world .crest-text b{font-size:17px}
.world .crest-text small{font-size:12px;white-space:normal}
.home-world .student{top:82%;--sw-box:min(42vh,340px)}
.home-world .teacher-announcement{display:none}
}
.world-loader{display:none}
.world-loading .world-backdrop,.world-loading .sw-floor{visibility:hidden}
.world-loading .world-loader{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:225px 22px 115px;background:radial-gradient(ellipse at 50% 65%,#30334b,#181c2b 75%)}
.world-load-panel{text-align:center;max-width:350px;color:#fff1d5}
.world-load-symbol{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 20px;border:1px solid #e2c39a75;border-radius:50%;color:#e2c39a}

.world-load-panel h2{font:500 25px/1.3 Georgia,serif;letter-spacing:.2px}
.world-load-message{margin:13px 0 0;font-size:13px;line-height:1.65;color:#c9c8cf}
.world-loader .world-load-panel .button{margin:20px auto 0;background:#e2c39a;border-color:#e2c39a;color:#292925}
.world-load-panel .button[hidden]{display:none}
@media(max-width:640px){
.world-loading .world-loader{padding:225px 24px 140px}
.world-load-panel h2{font-size:23px}
.world-load-message{font-size:12px}
}
.fireflies{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.world .firefly{left:var(--fx);top:var(--fy);width:var(--fs,3px);height:var(--fs,3px);animation-duration:var(--ft,6s);animation-delay:var(--fd,0s)}
.student .sw-doll{position:absolute;inset:0;display:block;animation:sw-idle 4.6s ease-in-out infinite;animation-delay:var(--delay,0s);transform-origin:50% 97%}
.student .sw-band{position:absolute;inset:0;display:block}
.student .sw-band>*{position:absolute;inset:0;display:block;width:100%;height:100%;margin:0;animation:none;filter:none}
.student .sw-legs{clip-path:inset(55.5% 0 0 0)}
.student .sw-torso,.student .sw-head{will-change:transform}
.student .sw-torso{clip-path:inset(30% 0 44% 0);transform-origin:50% 56%;animation:sw-breathe 3.9s ease-in-out infinite;animation-delay:var(--sw-breath,0s)}
.student .sw-head{clip-path:inset(0 0 69% 0);transform-origin:50% 31%;animation:sw-tilt 6.8s ease-in-out infinite,sw-follow 3.9s ease-in-out infinite;animation-delay:var(--sw-head,0s),var(--sw-breath,0s)}
@keyframes sw-idle{0%,100%{transform:translateY(0) rotate(-.35deg)}50%{transform:translateY(-1.5px) rotate(.35deg)}}
@keyframes sw-breathe{0%,100%{scale:1 1}50%{scale:1 1.02}}
@keyframes sw-follow{0%,100%{translate:0 0}50%{translate:0 -.52%}}
@keyframes sw-tilt{0%,100%{rotate:0deg}22%{rotate:2.5deg}46%{rotate:.4deg}72%{rotate:-2.5deg}}
@keyframes sw-twinkle{0%,100%{opacity:.65;transform:rotate(-6deg) scale(.9)}50%{opacity:1;transform:rotate(12deg) scale(1.06)}}
@keyframes sw-firefly{0%,100%{opacity:0;transform:translate(0,10px)}40%,65%{opacity:.8}75%{transform:translate(12px,-17px)}}
@keyframes sw-petfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes sw-eggcradle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.spark-burst{position:absolute;left:50%;top:30%;width:0;height:0;pointer-events:none;z-index:60}
.spark-burst i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#ffe7a3;box-shadow:0 0 10px 2px #ffd36b;animation:sw-burst 1.1s ease-out both;transform:rotate(var(--a)) translateY(0)}
.spark-burst b{position:absolute;left:0;top:-12px;transform:translateX(-50%);font-size:28px;font-weight:800;color:#ffe7a3;text-shadow:0 2px 8px #000,0 0 18px #ffcf6a;white-space:nowrap;animation:sw-floatup 1.4s ease-out both}
.spark-burst b.minus{color:#ffb3b3;text-shadow:0 2px 8px #000}
@keyframes sw-burst{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(-1 * var(--d))) scale(.3)}}

.hatch-stage{position:absolute;inset:0;z-index:40;display:grid;place-items:center;overflow:hidden;color:#fff;animation:sw-fadein .4s both}
.hatch-sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,#5a3d8a99,#120d1fe6 70%);backdrop-filter:blur(3px)}
.hatch-rays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,#ffe9b814 0deg 6deg,transparent 6deg 20deg);opacity:0;filter:blur(6px);animation:sw-rays 18s linear infinite;transition:opacity .8s}
.hatch-from{position:relative;display:grid;place-items:center;width:min(44vmin,300px);aspect-ratio:1;animation:sw-fromnest .8s cubic-bezier(.2,.9,.3,1) both}
.hatch-nest{position:absolute;left:-15%;bottom:-36%;width:130%;height:130%;object-fit:contain;filter:drop-shadow(0 10px 18px #0009)}
.phase-reveal .hatch-from{opacity:0;transition:opacity .3s}
.hatch-egg{position:relative;width:78%;aspect-ratio:1;display:grid;place-items:center;transform-origin:50% 90%;filter:drop-shadow(0 10px 20px #000a)}
@keyframes sw-fromnest{from{translate:var(--sw-hx,0) var(--sw-hy,0);scale:.28}}
.hatch-egg img{width:100%;height:100%;object-fit:contain}
.hatch-egg .crack{position:absolute;width:3px;background:linear-gradient(#2a1b3a,#120a1f);border-radius:2px;box-shadow:0 0 8px 2px #ffe9b8;opacity:0;transform-origin:top;transform:scaleY(0)}
.hatch-egg .c1{left:48%;top:14%;height:34%;transform:rotate(18deg) scaleY(0)}

.hatch-pet img{width:min(58vmin,420px);height:min(58vmin,420px);object-fit:contain;filter:drop-shadow(0 12px 28px #000c);position:relative;z-index:1;animation:sw-petfloat 3.6s ease-in-out infinite}
.hatch-glow{position:absolute;width:min(70vmin,520px);height:min(70vmin,520px);border-radius:50%;background:radial-gradient(circle,#ffe9b8bb,#ffb86a33 45%,transparent 70%);animation:sw-pulse 2.2s ease-in-out infinite}
.hatch-title{text-align:center;text-shadow:0 2px 12px #000;position:relative;z-index:1;font-family:var(--sw-font)}
.hatch-title .eyebrow{color:#ffe9b8;display:block;margin-bottom:6px}

.phase-reveal .hatch-sky{background:radial-gradient(ellipse at 50% 55%,#6b4aa0bb,#120d1ff0 72%)}
.phase-reveal .hatch-rays{opacity:1}
.phase-reveal .hatch-pet{opacity:1;transform:scale(1) translateY(0);transition:transform .7s cubic-bezier(.2,1.4,.4,1),opacity .3s}
.phase-reveal .hatch-sparks i{animation:sw-hatchspark var(--t) ease-out both}
.hatch-sparks{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.hatch-sparks i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#fff1c2;box-shadow:0 0 12px 3px #ffd36b;opacity:0;transform:rotate(var(--a)) translateY(0)}
.hatch-stage .hatch-skip{position:absolute;right:26px;bottom:26px;background:#1c203aa6;color:#fff;border:1px solid #ffffff32;backdrop-filter:blur(12px)}
@keyframes sw-eggshake{0%,100%{transform:rotate(-6deg) translateX(-3px)}50%{transform:rotate(6deg) translateX(3px)}}
@keyframes sw-rays{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes sw-pulse{0%,100%{transform:scale(.92);opacity:.8}50%{transform:scale(1.06);opacity:1}}
@keyframes sw-hatchspark{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(1.2)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(-1 * var(--d))) scale(.2)}}
@keyframes sw-fadein{from{opacity:0}to{opacity:1}}
.world{--bright:1;--sat:1}

.sky-dawn .sky-overlay{background:linear-gradient(#ff9c7a80,#ffb3b955 38%,transparent 72%)}
.sky-day{--bright:1.2;--sat:1.06}
.sky-day .sky-overlay{background:linear-gradient(#8fd0ffb3,#c7e9ff66 42%,transparent 72%)}
.sky-golden{--bright:1.06;--sat:1.08}
.sky-golden .sky-overlay{background:linear-gradient(#ffc46e73,#ff9a5a3d 45%,transparent 75%)}
.sky-night{--bright:.66;--sat:.88}
.sky-night .sky-overlay{background:linear-gradient(#0a0e2ef0,#16184ab8 42%,#1a123a66)}
.stars{position:absolute;inset:0 0 50%;z-index:-3;pointer-events:none;opacity:0;transition:opacity 1.2s}
.sky-night .stars,.sky-dawn .stars{opacity:1}
.sky-dawn .stars{opacity:.45}
.stars i{position:absolute;left:var(--sx);top:var(--sy);width:var(--ss);height:var(--ss);border-radius:50%;background:#fff;box-shadow:0 0 6px 1px #fff8;animation:sw-twinkle 3.4s ease-in-out infinite;animation-delay:var(--sd)}
.sky-night .student .sw-figure{filter:brightness(.92)}
.sky-night .fireflies{opacity:1}
.sky-day .fireflies{opacity:.25}
.sky-dawn .fireflies{opacity:.5}
.birds{position:absolute;inset:6% 0 60%;z-index:-2;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 1s}
.sky-day .birds,.sky-golden .birds,.sky-dawn .birds{opacity:1}
.bird{position:absolute;top:30%;left:-6%;width:18px;height:8px;animation:sw-fly 38s linear infinite;animation-delay:-6s}
.bird:before,.bird:after{content:"";position:absolute;top:0;width:9px;height:8px;border-top:2px solid #2b2742cc;border-radius:50% 50% 0 0;animation:sw-flap .5s ease-in-out infinite alternate}
.bird:before{left:0;transform-origin:right bottom}
.bird:after{right:0;transform-origin:left bottom}
.bird.b2{top:18%;animation-duration:52s;animation-delay:-30s;transform:scale(.7)}
.bird.b3{top:40%;animation-duration:45s;animation-delay:-18s;transform:scale(.55)}
@keyframes sw-fly{0%{left:-6%;translate:0 0}50%{translate:0 -14px}100%{left:106%;translate:0 0}}
@keyframes sw-flap{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.weather{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.weather i{position:absolute;left:var(--wx);top:-6%;width:var(--ws);animation-delay:var(--wd);animation-duration:var(--wt);animation-iteration-count:infinite;animation-timing-function:linear}
.weather-rain .weather i{height:22px;background:linear-gradient(#ffffff00,#cfe4ff99);border-radius:1px;animation-name:sw-rain}
.weather-rain .world-backdrop{--bright:.9}
.weather-rain .sky-overlay{box-shadow:inset 0 0 0 100vmax #3a4a6a33}
.weather-snow .weather i{height:var(--ws);border-radius:50%;background:#fff;box-shadow:0 0 6px 1px #fff9;opacity:.9;animation-name:sw-snow}
@keyframes sw-rain{to{transform:translateY(112vh) translateX(-30px)}}
@keyframes sw-snow{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(55vh) translateX(18px)}100%{transform:translateY(112vh) translateX(-10px)}}
.student .scene-pet.cheer{animation:sw-cheer .45s ease-out 4}
.student .scene-pet.egg.cheer{animation:none}
.student .scene-pet.egg.cheer .sw-egg{animation:sw-cheer-egg .45s ease-out 4}
.student .scene-pet.droop{animation:sw-droop 1.6s ease-in-out 1}
.cheering .student .scene-pet:not(.egg){animation:sw-cheer .45s ease-out 5}
.cheering .student .scene-pet.egg .sw-egg{animation:sw-cheer-egg .45s ease-out 5}
.cheering .student .sw-doll{animation:sw-bounce .5s ease-out 4}
@keyframes sw-cheer{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-22%) scale(1.08) rotate(-6deg)}}
@keyframes sw-cheer-egg{0%,100%{transform:translateY(0)}50%{transform:translateY(-14%) rotate(8deg)}}
@keyframes sw-droop{0%,100%{transform:translateY(0) rotate(0);filter:none}40%,70%{transform:translateY(3%) rotate(-8deg);filter:saturate(.5)}}
@keyframes sw-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
.confetti{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;left:var(--cx);top:-4%;width:9px;height:14px;background:var(--cc);border-radius:2px;transform:rotate(var(--cr));animation:sw-confetti var(--ct) ease-in both;animation-delay:var(--cd)}
@keyframes sw-confetti{0%{transform:translateY(0) rotate(var(--cr));opacity:1}80%{opacity:1}100%{transform:translateY(112vh) rotate(calc(var(--cr) + 540deg));opacity:0}}
.fireworks{position:absolute;inset:0;z-index:35;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2a1f4a66,#0a081a99);animation:sw-fadein .4s both}
.rocket{position:absolute;left:var(--rx);top:28%;width:0;height:0;animation:sw-rocket .9s ease-out both;animation-delay:var(--rd)}
.rocket i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--rc);box-shadow:0 0 14px 4px var(--rc),0 18px 0 -3px var(--rc);transform:rotate(var(--a));animation:sw-spark 1.7s ease-out both;animation-delay:calc(var(--rd) + .9s)}
@keyframes sw-rocket{0%{transform:translateY(60vh);opacity:0}30%{opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes sw-spark{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(1.3)}100%{opacity:0;transform:rotate(var(--a)) translateY(-210px) scale(.4)}}
.fireworks-title{position:absolute;left:50%;top:58%;transform:translateX(-50%);text-align:center;color:#fff;text-shadow:0 2px 12px #000;font-family:var(--sw-font);animation:sw-floatup-slow 5s ease-out both;animation-delay:1.2s;opacity:0}
.fireworks-title .eyebrow{color:#ffe9b8}
.fireworks-title strong{display:block;font-size:clamp(34px,7vmin,64px);font-weight:900;color:#fff3d6}
.fireworks-title em{display:block;font-style:normal;font-size:14px;color:#f3e6c9;margin-top:6px}
@keyframes sw-floatup-slow{0%{opacity:0;transform:translate(-50%,20px)}15%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}

.student.sw-enter{animation:sw-walkin 1.2s cubic-bezier(.33,.8,.45,1) both;animation-delay:var(--sw-in,0s)}
.student.sw-enter .sw-figure{animation:sw-walkbob .3s ease-in-out 4 both;animation-delay:var(--sw-in,0s)}
.student.sw-enter .scene-pet:not(.egg){animation:sw-trot .3s ease-in-out 4 both;animation-delay:calc(var(--sw-in,0s) + .12s)}
.student.sw-leave{animation:sw-leave .75s ease-in both;pointer-events:none}
.student.sw-wave .sw-figure{animation:sw-wave .9s ease-in-out 1}
.student .scene-pet.sw-grow{animation:sw-grow 1.4s cubic-bezier(.2,1.3,.4,1) 1}
.world-loading .student,.world-loading .student *{animation-play-state:paused!important}
.scene-pet[data-species="dragon"]{--sw-pet-idle:sw-perch 5.6s ease-in-out infinite}
.scene-pet[data-species="wolf"]{--sw-pet-idle:sw-sniff 3.4s ease-in-out infinite}
.scene-pet[data-species="sunbird"]{--sw-pet-idle:sw-flutter 2.6s ease-in-out infinite}
.scene-pet[data-species="otter"]{--sw-pet-idle:sw-sway 3.6s ease-in-out infinite}
.scene-pet[data-species="grove"]{--sw-pet-idle:sw-rock 6.4s ease-in-out infinite}
@keyframes sw-walkin{from{left:50%;top:var(--sw-door);scale:.45;opacity:0}14%{opacity:1}}
@keyframes sw-walkbob{0%,100%{translate:0 0;rotate:0deg}25%{rotate:-1.5deg}50%{translate:0 -4%}75%{rotate:1.5deg}}
@keyframes sw-trot{0%,100%{translate:0 0}50%{translate:0 -10%}}
@keyframes sw-leave{to{opacity:0;scale:.6;translate:0 -30px}}
@keyframes sw-wave{0%,100%{rotate:0deg}20%{rotate:-4deg}45%{rotate:3.5deg}70%{rotate:-2deg}}
@keyframes sw-grow{0%{transform:scale(.6);filter:brightness(1.8) drop-shadow(0 0 18px #ffe9b8)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes sw-perch{0%,100%{transform:scale(1,1) rotate(-1deg)}50%{transform:scale(1.03,.97) rotate(1deg)}}
@keyframes sw-sniff{0%,100%{transform:translateY(0) rotate(0)}12%{transform:translateY(-1.5%)}24%{transform:translateY(0)}36%{transform:translateY(-1.5%)}48%{transform:translateY(0) rotate(0)}60%{transform:translate(1%,0) rotate(5deg)}66%{transform:translate(.5%,0) rotate(3deg)}72%{transform:translate(1%,0) rotate(5deg)}84%{transform:translateY(0) rotate(0)}}
@keyframes sw-flutter{0%,100%{transform:translateY(0) rotate(0)}15%{transform:translateY(-3%) rotate(-2deg)}30%{transform:translateY(0)}45%{transform:translateY(-4%) rotate(2deg)}60%{transform:translateY(0)}}
@keyframes sw-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes sw-rock{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@media(prefers-reduced-motion:reduce){
.world,.world *,.world *:before,.world *:after{animation:none!important;transition:none!important}
}
.world[data-motion="reduced"],.world[data-motion="reduced"] *,.world[data-motion="reduced"] *:before,.world[data-motion="reduced"] *:after{animation:none!important;transition:none!important}

:root{
--navy:#0A1230;--panel:#15214A;--glass:rgba(14,24,60,.72);--glass-edge:rgba(255,255,255,.2);--pill-dark:rgba(8,14,36,.58);
--cream:#F7EBD0;--cream-2:rgba(247,235,208,.75);--star:#F3D58A;--gold-edge:#7A5312;--gold-press:#8A5F16;--teal:#5FD7BC;--bad:#FF9AAE;
--gold-fill:linear-gradient(180deg,#FFE9AE 0%,#EBC56C 48%,#CB9730 56%,#E4BA5E 100%);
--text:"Nunito","Segoe UI",system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;--display:var(--text);
--shadowtext:0 1px 0 rgba(0,0,0,.6),0 2px 10px rgba(0,0,0,.8);
color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{overflow-x:clip;margin:0;min-height:100vh;color:var(--cream);font:700 17px/1.5 var(--text);background:radial-gradient(ellipse 80% 60% at 50% 20%,#1a2a60,#0A1230 70%) fixed var(--navy)}
.sp-app{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:720px;margin:0 auto;padding-block:max(18px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sp-sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--star);outline-offset:3px}
img{max-width:100%}

.sp-emblem{display:block;line-height:0;filter:drop-shadow(0 12px 20px rgba(0,0,0,.55))}
.sp-emblem>svg{display:block;width:100%;height:auto;aspect-ratio:560/170}
.sp-emblem-top{width:min(300px,72vw);margin:6px auto 0}
.sp-i{width:1em;height:1em;fill:currentColor;flex:none}

.sp-top{display:flex;justify-content:center;width:100%}
.sp-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 13px 4px 10px;border-radius:999px;background:var(--pill-dark);color:var(--cream);font:900 17px/1.3 var(--text);font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sp-chip-star{color:var(--star)}
.sp-chip-word{font-weight:800;font-size:.85em;color:var(--cream-2)}
.sp-link{min-height:44px;padding:0 4px;border:0;background:none;color:var(--cream);font:800 inherit/1 var(--text);text-decoration:underline;text-underline-offset:3px}
.sp-pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;font:900 15px/1 var(--text);color:var(--cream);background:var(--glass);border:1px solid var(--glass-edge);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 14px rgba(0,0,0,.35)}
.sp-pill-gold{background:var(--gold-fill);border-color:var(--gold-edge);color:#1A2550;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 3px 0 var(--gold-press),0 8px 14px rgba(0,0,0,.35)}
.sp-pill-star{display:inline-flex;font-size:16px}
.sp-pill:active{transform:translateY(3px)}
.sp-card{width:min(100%,460px);padding:22px;background:var(--glass);border:1px solid var(--glass-edge);border-radius:22px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 18px 40px rgba(0,0,0,.45);text-align:center}
.sp-wait{display:flex;flex-direction:column;align-items:center;gap:12px;font:800 18px/1.3 var(--text)}
.sp-wait p{margin:0}
.sp-spinner{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.14);border-top-color:var(--star);animation:sp-spin 1s linear infinite}
@keyframes sp-spin{to{transform:rotate(360deg)}}
.sp-problem{display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-problem p{margin:0}
.sp-big{font:900 26px/1.15 var(--text);color:#fff}
.sp-problem-text{font:800 17px/1.4 var(--text);color:var(--cream)}
.sp-title{margin:0;font:900 clamp(26px,7vw,34px)/1.1 var(--text);color:#fff;text-wrap:balance;overflow-wrap:anywhere;text-shadow:var(--shadowtext)}
.sp-lead{margin:2px 0 0;font:800 17px/1.4 var(--text);color:var(--cream-2)}
.sp-btn{min-height:52px;padding:10px 24px;border:1px solid var(--gold-edge);border-radius:999px;background:var(--gold-fill);color:#1A2550;font:900 18px/1 var(--text);box-shadow:inset 0 2px 0 rgba(255,255,255,.8),0 5px 0 var(--gold-press),0 14px 24px rgba(0,0,0,.45)}
.sp-btn:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 1px 0 var(--gold-press),0 6px 12px rgba(0,0,0,.4)}
.sp-btn:disabled{opacity:.7}
.sp-btn-quiet{min-height:48px;padding:10px 22px;border-radius:999px;border:1px solid var(--glass-edge);background:var(--glass);color:var(--cream);font:900 16px/1 var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 22px rgba(0,0,0,.35)}
.sp-btn-quiet:active{transform:translateY(4px)}

.sp-open{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(100%,380px);margin-top:max(4vh,12px);text-align:center}
.sp-open-mark{width:min(340px,86vw);margin-bottom:10px}
.sp-fields{display:flex;flex-direction:column;gap:14px;width:100%;text-align:left}
.sp-field-label{display:flex;flex-direction:column;gap:6px}
.sp-field-name{font:900 13px/1 var(--text);letter-spacing:.16em;text-transform:uppercase;color:var(--cream-2)}
.sp-field{width:100%;min-height:56px;padding:12px 18px;border:1px solid var(--glass-edge);border-radius:16px;background:rgba(8,14,36,.6);color:#fff;font:900 22px/1.2 var(--text);letter-spacing:.04em;box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}
.sp-field::placeholder{color:rgba(247,235,208,.45);font-weight:700;font-size:17px;letter-spacing:0}
.sp-open-btn{width:100%;margin-top:4px}
.sp-open-help{margin:0;max-width:34ch;font:700 14px/1.45 var(--text);color:var(--cream-2)}
.sp-pin-msg{margin:0;min-height:1.5em;font:800 15px/1.4 var(--text);color:var(--bad);max-width:34ch}

.sp-pick{display:flex;flex-direction:column;gap:12px}
.sp-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;margin-top:6px}
.sp-name{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;min-height:44px;padding:8px 6px 12px;border:1px solid var(--glass-edge);border-radius:20px;background:var(--glass);box-shadow:0 8px 18px rgba(0,0,0,.35)}
.sp-name:hover{background:#1b2a5c}
.sp-name-art{width:88px;height:88px}
.sp-name-art>svg,.sp-pin-art>svg,.sp-room-me>svg{display:block;width:100%;height:100%}
.sp-name-text{font:900 16px/1.3 var(--text);color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-another{align-self:flex-start;margin-top:6px}
.sp-pin{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.sp-pin-art{width:120px;height:120px}
.sp-dots{display:flex;gap:16px;margin:14px 0 4px}
.sp-dot{width:20px;height:20px;border-radius:50%;border:3px solid var(--star)}
.sp-dot-on{background:var(--star)}
.sp-keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin-top:8px}
.sp-key{height:72px;border:1px solid var(--glass-edge);border-radius:50%;background:var(--glass);color:var(--cream);font:900 28px/1 var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.4)}
.sp-key:active{transform:translateY(4px);box-shadow:none}
.sp-key-back{font-size:24px;color:var(--cream-2)}

.sp-app-yard{display:block;max-width:none;margin:0;padding:0}
.sp-world{position:relative;min-height:100vh;min-height:100dvh}
@media(max-width:1100px){.sp-app-yard .world:not(.home-world){position:relative}}
.sp-hud{display:contents}
.sp-qb{position:absolute;z-index:12;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;border:0;background:none;color:#fff;font:800 18px/1 var(--text);text-shadow:var(--shadowtext)}
.sp-qb-disc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 22px rgba(0,0,0,.45);color:var(--cream);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sp-qb-disc .sp-i{width:34px;height:34px}
.sp-qb:active .sp-qb-disc{transform:translateY(4px)}
.sp-qb-room{right:max(48px,env(safe-area-inset-right,0px));top:max(36px,env(safe-area-inset-top,0px))}
.sp-qb-small .sp-qb-disc{width:56px;height:56px}
.sp-qb-small .sp-qb-disc .sp-i{width:26px;height:26px}
.sp-qb-sound{left:max(48px,env(safe-area-inset-left,0px));bottom:max(36px,env(safe-area-inset-bottom,0px));opacity:.75}
.sp-note{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;margin:0;padding:8px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-edge);color:var(--cream);font:800 14px/1.3 var(--text)}
.sp-note[hidden]{display:none}
@media(max-width:640px){
.sp-qb{font-size:15px;gap:6px}
.sp-qb-room{right:max(14px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px))}
.sp-qb-room .sp-qb-disc{width:60px;height:60px}
.sp-qb-room .sp-qb-disc .sp-i{width:28px;height:28px}
.sp-qb-sound{left:max(14px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px))}
.sp-qb-small .sp-qb-disc{width:48px;height:48px}
.sp-note{bottom:max(78px,calc(env(safe-area-inset-bottom,0px) + 64px))}
}

.sp-reveal{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:24px 16px;background:rgba(5,9,25,.5);cursor:pointer;text-align:center;opacity:1;transition:opacity .4s ease-out;animation:sp-reveal-in .5s ease-out}
.sp-reveal-wash{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 42%,rgba(10,18,48,.1),rgba(10,18,48,.6) 100%);pointer-events:none}
.sp-reveal>*{position:relative}
.sp-reveal-mark{width:min(820px,86vw);filter:drop-shadow(0 20px 36px rgba(0,0,0,.65))}
.sp-reveal-class{margin:clamp(16px,4vh,40px) 0 0;max-width:100%;overflow-wrap:anywhere;font:900 clamp(18px,2.6vw,30px)/1.2 var(--text);letter-spacing:.22em;text-transform:uppercase;color:var(--cream);text-shadow:0 2px 14px rgba(0,0,0,.8)}
.sp-reveal-class:empty{display:none}
.sp-reveal-hint{margin:clamp(28px,8vh,80px) 0 0;font:800 clamp(15px,1.8vw,22px)/1.3 var(--text);color:rgba(247,235,208,.75)}
.sp-reveal-out{opacity:0;pointer-events:none}
@keyframes sp-reveal-in{from{opacity:0}}

@media(max-width:1100px){
.sp-app-yard.sp-app-yard .sp-many .world:not(.home-world){--stage-height:max(100dvh,calc(600px + (var(--sp-rows,4) - 1) * 145px))}
.sp-app-yard .sp-many .world:not(.home-world) .courtyard{top:auto;bottom:190px;height:calc((var(--sp-rows,4) - 1) * 217px)}
.sp-app-yard.sp-app-yard .sp-many .world:not(.home-world) .student{--size:120px!important}
}
@media(min-width:1101px){
.sp-app-yard .sp-many .world:not(.home-world) .student{bottom:calc(92px + var(--depth) * 27);--size:clamp(130px,10vw,190px)!important}
.sp-app-yard .sp-many .student-label>strong{font-size:16px}
.sp-app-yard .sp-many .student-sparkles{padding:4px 9px}
.sp-app-yard .sp-many .student-sparkles>b{font-size:18px}
.sp-app-yard .sp-many .sparkles-word{display:none}

var CARE = P.CARE;
var REACTIONS = {pet: ['♥', 'enjoyed a gentle pat.'], water: ['💧', 'had a refreshing drink.'], snack: ['🍎', 'enjoyed the snack.'], walk: ['🐾', 'took a little stroll with you.']};

}

if (pet) { pet.querySelectorAll('.sp-care-reaction').forEach(function (x) { x.remove(); }); pet.append(tag); pet.classList.remove('sp-care-walk'); if (action === 'walk' && !reduceMotion()) pet.classList.add('sp-care-walk'); else if (action !== 'pet') wobble(pet); }
S.careTimer = setTimeout(function () { S.careTimer = 0; if (tag.isConnected) tag.remove(); if (pet) pet.classList.remove('sp-care-walk'); if (msg.isConnected) msg.textContent = 'Your ' + k.name + ' is happy to see you.'; }, 2200);
}
