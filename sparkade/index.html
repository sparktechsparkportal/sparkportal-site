<style>
:where(.world),:where(.world) *{box-sizing:border-box}
:where(.world) button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:where(.world) h2,:where(.world) p{margin:0}
:where(.world) .sw-icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:where(.world) .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;font-weight:750}
:where(.world) .button{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid #ffffff32;border-radius:10px;padding:11px 16px;min-height:44px;font-weight:600}
.sw-slot{display:contents}
.world{position:fixed;inset:0;background:#201c2b;color:#fff;overflow:hidden;isolation:isolate}
.world-backdrop{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-5;transform:scale(1.025);animation:sw-arrive 1s ease-out both}
.world-backdrop:after{content:"";position:absolute;inset:0;background:linear-gradient(#17152773,transparent 30%,transparent 60%,#17152d88)}
.world .firefly{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3bf;box-shadow:0 0 10px 3px #ffcc7160;pointer-events:none;animation:sw-firefly 6s ease-in-out infinite;z-index:1}
.courtyard{position:absolute;inset:0;z-index:3;overflow:visible;pointer-events:none}
.student{position:absolute;left:var(--x);bottom:calc(105px + var(--depth));pointer-events:auto;width:var(--size);height:calc(var(--size) + var(--label-reserve,72px));transform:translateX(-50%);padding:0;border:0;isolation:isolate;outline-offset:-25px!important;transition:filter .18s;z-index:var(--z);overflow:visible}
.student .sw-figure{position:relative;display:block;width:100%;height:var(--size);pointer-events:none;filter:drop-shadow(0 5px 3px #18112645);transform-origin:50% 100%}
.student .ground-shadow{position:absolute;left:34%;right:34%;height:calc(var(--size) * .035);bottom:calc(var(--label-reserve,72px) + var(--size) * .0293);transform:translateY(50%);background:radial-gradient(ellipse,#201519c9 10%,#24191b75 45%,#24191b00 74%);border-radius:50%;filter:blur(1px);z-index:-1;pointer-events:none}
.student:hover,.student:focus-visible{z-index:120;filter:drop-shadow(0 0 14px #ffe19d99)}
.student.selected:after{content:"✓";position:absolute;left:50%;top:2%;transform:translateX(-50%);background:#ffe1a0;color:#51402a;border-radius:50%;width:29px;height:29px;display:grid;place-items:center;font-weight:800}
.student-label{position:absolute;left:50%;bottom:0;transform:translateX(-50%);color:#fff;min-width:130px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
.student-label>strong{font-size:22px;font-weight:750;line-height:1.15;text-shadow:0 2px 5px #000,0 0 16px #1c122a}
.student-sparkles{display:flex;align-items:center;justify-content:center;gap:7px;padding:6px 13px;border-radius:24px;background:#201d30ed;border:1px solid #f5d99d9e;box-shadow:0 3px 12px #0003;color:#ffe2a0;line-height:1}
.student-sparkles>b{font-size:24px;font-weight:800}
.student-sparkles>span:first-child{font-size:16px}
.sparkles-word{font-size:11px;color:#fff1cd;font-weight:650}
.student .scene-pet{position:absolute;width:43%;height:43%;object-fit:contain;bottom:72px;left:60%;filter:drop-shadow(0 3px 4px #26173580);pointer-events:none}
.home-world .student{left:50%;bottom:9%;--size:440px;--y:9%;--x:50%;--z:4}
.home-world .courtyard{inset:0}
.home-world .student-label>strong{font-size:24px}
.home-world .student-sparkles>b{font-size:28px}
@keyframes sw-idle{0%,100%{transform:translateY(0) rotate(-.35deg)}50%{transform:translateY(-3px) rotate(.35deg)}}
@keyframes sw-twinkle{0%,100%{opacity:.65;transform:rotate(-6deg) scale(.9)}50%{opacity:1;transform:rotate(12deg) scale(1.06)}}
@keyframes sw-firefly{0%,100%{opacity:0;transform:translate(0,10px)}40%,65%{opacity:.8}75%{transform:translate(12px,-17px)}}
@keyframes sw-arrive{from{opacity:.2;transform:scale(1.075)}to{opacity:1;transform:scale(1.025)}}
@media(max-width:1120px){
.home-world .student{--size:390px}
}
@media(max-width:850px){
.home-world .student{left:45%;--size:330px}
}
@media(max-width:640px){
.world-backdrop{background-position:44% 50%}
.world:not(.home-world) .courtyard{inset:230px 0 125px}
.student{--size:clamp(104px,30vw,132px)!important;left:var(--mx);bottom:var(--my);--label-reserve:54px;height:calc(var(--size) + var(--label-reserve))}
.student-label{min-width:98px;gap:5px;bottom:0}
.student-label>strong{font-size:17px}
.student-sparkles{padding:5px 9px;gap:5px}
.student-sparkles>b{font-size:20px}
.student-sparkles>span:first-child{font-size:12px}
.sparkles-word{font-size:9px}
.student .scene-pet{width:40%;height:40%;left:61%;bottom:54px}
.home-world .student{--size:340px!important;left:50%;bottom:13%}
.home-world .student-label>strong{font-size:22px}
}
.world-backdrop{animation:none;transform:none}
@media(min-width:641px) and (max-width:1100px){
.world:not(.home-world) .courtyard{inset:230px 0 130px}
.world:not(.home-world) .student{--size:clamp(135px,19vw,180px)!important;left:var(--mx);bottom:var(--my);--label-reserve:64px;height:calc(var(--size) + var(--label-reserve))}
.world:not(.home-world) .student-label>strong{font-size:19px}
.world:not(.home-world) .student-sparkles>b{font-size:22px}
}
@media(max-width:640px) and (max-height:740px){
.world:not(.home-world) .courtyard{inset:225px 0 125px}
.world:not(.home-world) .student{--size:clamp(82px,25vw,100px)!important;--label-reserve:48px;height:calc(var(--size) + var(--label-reserve))}
.student-label>strong{font-size:16px}
.student-sparkles>b{font-size:18px}
.student-sparkles{padding:4px 8px}
}
.courtyard-floor{display:none}
.teacher-announcement{position:absolute;z-index:10;top:126px;left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 50px));display:flex;align-items:center;gap:15px;padding:13px 23px;border:1px solid #e9c788a8;border-radius:4px 17px 4px 17px;background:linear-gradient(105deg,#f1dfb8f5,#fff1cff2 62%,#e4c98ef5);color:#3c3022;box-shadow:0 7px 22px #10112252,inset 0 0 0 4px #f9e8c45c;text-align:left}
.teacher-announcement:before,.teacher-announcement:after{content:"";position:absolute;top:10px;bottom:10px;width:5px;background:#584325;border:1px solid #e9c788;border-radius:4px}
.teacher-announcement:before{left:-4px}
.teacher-announcement:after{right:-4px}
.announcement-seal{width:39px;height:39px;display:grid;place-items:center;border:1px solid #b59456;border-radius:50%;background:#252d3c;color:#f5d99c;flex-shrink:0}
.teacher-announcement strong{display:block;font:700 11px/1.3 Inter,"Segoe UI",Arial,sans-serif;letter-spacing:.7px;text-transform:uppercase;color:#806130;margin-bottom:5px}
.teacher-announcement p{font:600 15px/1.45 Georgia,"Times New Roman",serif;margin:0}
.home-world .teacher-announcement{max-width:680px}
@media(max-width:1000px){
.world:not(.home-world) .world-backdrop{background-size:100% auto;background-position:center 20px;background-repeat:no-repeat}
.world:not(.home-world) .courtyard-floor{display:block;position:absolute;inset:31% 0 0;z-index:-4;background-size:auto 300%;background-position:center bottom;background-repeat:no-repeat}
.world:not(.home-world) .courtyard-floor:before{content:"";position:absolute;inset:0;background:linear-gradient(#16192b36,transparent 15%,#18132324)}
.world:not(.home-world) .student{--size:clamp(110px,16vw,150px)!important}
}
@media(max-width:640px){
.teacher-announcement{top:121px;width:calc(100% - 28px);padding:11px 13px;gap:10px}
.teacher-announcement strong{font-size:10px;letter-spacing:.3px}
.teacher-announcement p{font-size:13px;line-height:1.38}
.announcement-seal{width:30px;height:30px}
.announcement-seal svg{width:17px;height:17px}
.world:not(.home-world){position:absolute;inset:0 0 auto;min-height:780px;height:100dvh}
.world:not(.home-world) .world-backdrop{background-position:center 94px}
.world:not(.home-world) .courtyard-floor{top:275px}
.world:not(.home-world) .student{--size:clamp(102px,28vw,122px)!important;--label-reserve:50px;height:calc(var(--size) + var(--label-reserve))}
.home-world .teacher-announcement{display:none}
}
@media(max-width:1100px){
.world:not(.home-world){--stage-height:max(100dvh,820px);position:absolute;inset:0 0 auto;min-height:820px;height:var(--stage-height)}
.world:not(.home-world) .world-backdrop{background-size:100% auto;background-position:center 20px;background-repeat:no-repeat}
.world:not(.home-world) .courtyard-floor{display:block;position:absolute;inset:275px 0 0;z-index:-4;background-size:auto 300%;background-position:center bottom;background-repeat:no-repeat}
.world:not(.home-world) .student{--label-reserve:50px;--size:clamp(102px,calc((var(--stage-height) - 360px)/3 - 56px),150px)!important;height:calc(var(--size) + var(--label-reserve))}
.world:not(.home-world) .student-label>strong{font-size:19px}
.world:not(.home-world) .student-sparkles>b{font-size:22px}
}
@media(max-width:640px){
.world:not(.home-world) .world-backdrop{background-position:center 94px}
.world:not(.home-world) .student{--size:clamp(102px,calc((var(--stage-height) - 355px)/3 - 56px),122px)!important}
.world:not(.home-world) .student-label>strong{font-size:17px}
.world:not(.home-world) .student-sparkles>b{font-size:20px}
}
.world-loader{display:none}
.world-loading .world-backdrop,.world-loading .courtyard-floor,.world-loading .courtyard{visibility:hidden}
.world-loading .world-loader{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:225px 22px 115px;background:radial-gradient(ellipse at 50% 65%,#30334b,#181c2b 75%)}
.world-load-panel{text-align:center;max-width:350px;color:#fff1d5}
.world-load-symbol{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 20px;border:1px solid #e2c39a75;border-radius:50%;color:#e2c39a}
.world-load-symbol svg{width:27px;height:27px}
.world-load-panel h2{font:500 25px/1.3 Georgia,serif;letter-spacing:.2px}
.world-load-message{margin:13px 0 0;font-size:13px;line-height:1.65;color:#c9c8cf}
.world-loader .world-load-panel .button{margin:20px auto 0;background:#e2c39a;border-color:#e2c39a;color:#292925}
.world-load-panel .button[hidden]{display:none}
@media(max-width:640px){
.world-loading .world-loader{padding:225px 24px 140px}
.world-load-panel h2{font-size:23px}
.world-load-message{font-size:12px}
}
.fireflies{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.world .firefly{left:var(--fx);top:var(--fy);width:var(--fs,3px);height:var(--fs,3px);animation-duration:var(--ft,6s);animation-delay:var(--fd,0s)}
.student .sw-doll{position:absolute;inset:0;display:block;animation:sw-idle 4.6s ease-in-out infinite;animation-delay:var(--delay,0s);transform-origin:50% 100%}
.student .sw-band{position:absolute;inset:0;display:block}
.student .sw-band>*{position:absolute;inset:0;display:block;width:100%;height:100%;margin:0;animation:none;filter:none}
.student .sw-legs{clip-path:inset(55.5% 0 0 0)}
.student .sw-torso,.student .sw-head{will-change:transform}
.student .sw-torso{clip-path:inset(30% 0 44% 0);transform-origin:50% 56%;animation:sw-breathe 3.9s ease-in-out infinite;animation-delay:var(--sw-breath,0s)}
.student .sw-head{clip-path:inset(0 0 69% 0);transform-origin:50% 31%;animation:sw-tilt 6.8s ease-in-out infinite,sw-follow 3.9s ease-in-out infinite;animation-delay:var(--sw-head,0s),var(--sw-breath,0s)}
@keyframes sw-breathe{0%,100%{scale:1 1}50%{scale:1 1.02}}
@keyframes sw-follow{0%,100%{translate:0 0}50%{translate:0 -.52%}}
@keyframes sw-tilt{0%,100%{rotate:0deg}22%{rotate:2.5deg}46%{rotate:.4deg}72%{rotate:-2.5deg}}
.student .scene-pet{position:absolute;left:60%;bottom:calc(var(--label-reserve,72px) + var(--size) * .03);width:46%;aspect-ratio:1;height:auto;pointer-events:auto;z-index:2;animation:var(--sw-pet-idle,sw-petfloat 3.6s ease-in-out infinite);animation-delay:var(--delay,0s);filter:drop-shadow(0 6px 6px #1a102a80)}
.student .scene-pet img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.student .scene-pet:before{content:"";position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,#ffe9b848,transparent 62%);z-index:-1}
.student .scene-pet.egg{left:50%;width:27%;bottom:calc(var(--label-reserve,72px) + var(--size) * .36);transform:translateX(-50%);animation:sw-eggcradle 2.8s ease-in-out infinite;animation-delay:var(--delay,0s);filter:drop-shadow(0 4px 5px #1a102a99)}
@keyframes sw-petfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes sw-eggcradle{0%,100%{transform:translateX(-50%) rotate(-4deg)}50%{transform:translateX(-50%) translateY(-3px) rotate(4deg)}}
.spark-burst{position:absolute;left:50%;top:36%;width:0;height:0;pointer-events:none;z-index:60}
.spark-burst i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#ffe7a3;box-shadow:0 0 10px 2px #ffd36b;animation:sw-burst 1.1s ease-out both;transform:rotate(var(--a)) translateY(0)}
.spark-burst b{position:absolute;left:0;top:-12px;transform:translateX(-50%);font-size:28px;font-weight:800;color:#ffe7a3;text-shadow:0 2px 8px #000,0 0 18px #ffcf6a;white-space:nowrap;animation:sw-floatup 1.4s ease-out both}
.spark-burst b.minus{color:#ffb3b3;text-shadow:0 2px 8px #000}
@keyframes sw-burst{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(-1 * var(--d))) scale(.3)}}
@keyframes sw-floatup{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-64px) scale(1)}}
.teacher-announcement{animation:sw-bannerglow 6s ease-in-out infinite;transition:width .25s,padding .25s}
.teacher-announcement.collapsed{width:auto;max-width:calc(100% - 50px);padding:7px 12px 7px 10px;gap:9px;border-radius:30px}
.teacher-announcement.collapsed p{display:none}
.teacher-announcement.collapsed strong{margin:0;text-transform:none;font-size:12px;letter-spacing:.2px}
.teacher-announcement.collapsed .announcement-seal{width:28px;height:28px}
.teacher-announcement.collapsed .announcement-seal svg{width:15px;height:15px}
.teacher-announcement.collapsed:before,.teacher-announcement.collapsed:after{display:none}
.announcement-toggle{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#6f5327;background:#ffffff6b;border:1px solid #c9a55c;flex-shrink:0;transition:background .18s}
.announcement-toggle:hover{background:#fff}
.announcement-toggle svg{width:17px;height:17px;transition:transform .25s}
.teacher-announcement.collapsed .announcement-toggle{width:28px;height:28px;margin-left:2px}
.teacher-announcement.collapsed .announcement-toggle svg{transform:rotate(-90deg)}
@keyframes sw-bannerglow{0%,100%{box-shadow:0 7px 22px #10112252,inset 0 0 0 4px #f9e8c45c}50%{box-shadow:0 7px 30px #ffd68a44,inset 0 0 0 4px #fff3d07a}}
.hatch-stage{position:absolute;inset:0;z-index:40;display:grid;place-items:center;overflow:hidden;color:#fff;animation:sw-fadein .4s both}
.hatch-sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,#5a3d8a99,#120d1fe6 70%);backdrop-filter:blur(3px)}
.hatch-rays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,#ffe9b814 0deg 6deg,transparent 6deg 20deg);opacity:0;filter:blur(6px);animation:sw-rays 18s linear infinite;transition:opacity .8s}
.hatch-egg{position:relative;width:min(44vmin,300px);aspect-ratio:1;display:grid;place-items:center;transform-origin:50% 90%;filter:drop-shadow(0 10px 20px #000a)}
.hatch-egg img{width:100%;height:100%;object-fit:contain}
.hatch-egg .crack{position:absolute;width:3px;background:linear-gradient(#2a1b3a,#120a1f);border-radius:2px;box-shadow:0 0 8px 2px #ffe9b8;opacity:0;transform-origin:top;transform:scaleY(0)}
.hatch-egg .c1{left:48%;top:14%;height:34%;transform:rotate(18deg) scaleY(0)}
.hatch-egg .c2{left:38%;top:30%;height:30%;transform:rotate(-28deg) scaleY(0)}
.hatch-egg .c3{left:58%;top:38%;height:36%;transform:rotate(34deg) scaleY(0)}
.phase-shake .hatch-egg{animation:sw-eggshake .5s ease-in-out infinite}
.phase-shake-hard .hatch-egg{animation:sw-eggshake .16s ease-in-out infinite}
.phase-crack1 .hatch-egg .c1,.phase-crack2 .hatch-egg .c2,.phase-crack3 .hatch-egg .c3{opacity:1;transform:rotate(var(--r,18deg)) scaleY(1);transition:transform .25s ease-out,opacity .1s}
.phase-crack1 .hatch-egg .c1{--r:18deg}
.phase-crack2 .hatch-egg .c2{--r:-28deg}
.phase-crack3 .hatch-egg .c3{--r:34deg}
.phase-crack3 .hatch-egg{filter:drop-shadow(0 0 24px #ffe9b8) drop-shadow(0 10px 20px #000a)}
.phase-flash .hatch-sky{background:#fff6dc}
.phase-flash .hatch-egg{transform:scale(1.25);opacity:0;transition:transform .2s,opacity .2s}
.hatch-pet{position:absolute;display:grid;place-items:center;gap:14px;opacity:0;transform:scale(.3) translateY(40px);pointer-events:none}
.hatch-pet img{width:min(58vmin,420px);height:min(58vmin,420px);object-fit:contain;filter:drop-shadow(0 12px 28px #000c);position:relative;z-index:1;animation:sw-petfloat 3.6s ease-in-out infinite}
.hatch-glow{position:absolute;width:min(70vmin,520px);height:min(70vmin,520px);border-radius:50%;background:radial-gradient(circle,#ffe9b8bb,#ffb86a33 45%,transparent 70%);animation:sw-pulse 2.2s ease-in-out infinite}
.hatch-title{text-align:center;text-shadow:0 2px 12px #000;position:relative;z-index:1}
.hatch-title .eyebrow{color:#ffe9b8;display:block;margin-bottom:6px}
.hatch-title strong{font-family:Georgia,serif;font-size:clamp(30px,6vmin,52px);font-weight:500;color:#fff3d6;letter-spacing:1px;display:block}
.hatch-title em{display:block;font-style:normal;font-size:13px;color:#f3e6c9;margin-top:6px}
.phase-reveal .hatch-sky{background:radial-gradient(ellipse at 50% 55%,#6b4aa0bb,#120d1ff0 72%)}
.phase-reveal .hatch-rays{opacity:1}
.phase-reveal .hatch-egg{display:none}
.phase-reveal .hatch-pet{opacity:1;transform:scale(1) translateY(0);transition:transform .7s cubic-bezier(.2,1.4,.4,1),opacity .3s}
.phase-reveal .hatch-sparks i{animation:sw-hatchspark var(--t) ease-out both}
.hatch-sparks{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.hatch-sparks i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#fff1c2;box-shadow:0 0 12px 3px #ffd36b;opacity:0;transform:rotate(var(--a)) translateY(0)}
.hatch-stage .hatch-skip{position:absolute;right:26px;bottom:26px;background:#1c203aa6;color:#fff;border:1px solid #ffffff32;backdrop-filter:blur(12px)}
@keyframes sw-eggshake{0%,100%{transform:rotate(-6deg) translateX(-3px)}50%{transform:rotate(6deg) translateX(3px)}}
@keyframes sw-rays{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes sw-pulse{0%,100%{transform:scale(.92);opacity:.8}50%{transform:scale(1.06);opacity:1}}
@keyframes sw-hatchspark{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(1.2)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(-1 * var(--d))) scale(.2)}}
@keyframes sw-fadein{from{opacity:0}to{opacity:1}}
@media(max-width:640px){
.teacher-announcement.collapsed{top:121px;max-width:calc(100% - 28px)}
.student .scene-pet{width:44%}
.hatch-stage .hatch-skip{right:14px;bottom:110px}
}
.world{--bright:1;--sat:1}
.world .world-backdrop,.world .courtyard-floor{filter:brightness(var(--bright)) saturate(var(--sat));transition:filter 1.2s}
.sky-overlay{position:absolute;inset:0;z-index:-4;pointer-events:none;transition:opacity 1.2s}
.sky-dawn{--bright:1.02;--sat:1.05}
.sky-dawn .sky-overlay{background:linear-gradient(#ff9c7a80,#ffb3b955 38%,transparent 72%)}
.sky-day{--bright:1.2;--sat:1.06}
.sky-day .sky-overlay{background:linear-gradient(#8fd0ffb3,#c7e9ff66 42%,transparent 72%)}
.sky-golden{--bright:1.06;--sat:1.08}
.sky-golden .sky-overlay{background:linear-gradient(#ffc46e73,#ff9a5a3d 45%,transparent 75%)}
.sky-night{--bright:.66;--sat:.88}
.sky-night .sky-overlay{background:linear-gradient(#0a0e2ef0,#16184ab8 42%,#1a123a66)}
.stars{position:absolute;inset:0 0 50%;z-index:-3;pointer-events:none;opacity:0;transition:opacity 1.2s}
.sky-night .stars,.sky-dawn .stars{opacity:1}
.sky-dawn .stars{opacity:.45}
.stars i{position:absolute;left:var(--sx);top:var(--sy);width:var(--ss);height:var(--ss);border-radius:50%;background:#fff;box-shadow:0 0 6px 1px #fff8;animation:sw-twinkle 3.4s ease-in-out infinite;animation-delay:var(--sd)}
.sky-night .student .sw-figure{filter:brightness(.92)}
.sky-night .fireflies{opacity:1}
.sky-day .fireflies{opacity:.25}
.sky-dawn .fireflies{opacity:.5}
.birds{position:absolute;inset:6% 0 60%;z-index:-2;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 1s}
.sky-day .birds,.sky-golden .birds,.sky-dawn .birds{opacity:1}
.bird{position:absolute;top:30%;left:-6%;width:18px;height:8px;animation:sw-fly 38s linear infinite;animation-delay:-6s}
.bird:before,.bird:after{content:"";position:absolute;top:0;width:9px;height:8px;border-top:2px solid #2b2742cc;border-radius:50% 50% 0 0;animation:sw-flap .5s ease-in-out infinite alternate}
.bird:before{left:0;transform-origin:right bottom}
.bird:after{right:0;transform-origin:left bottom}
.bird.b2{top:18%;animation-duration:52s;animation-delay:-30s;transform:scale(.7)}
.bird.b3{top:40%;animation-duration:45s;animation-delay:-18s;transform:scale(.55)}
@keyframes sw-fly{0%{left:-6%;translate:0 0}50%{translate:0 -14px}100%{left:106%;translate:0 0}}
@keyframes sw-flap{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.weather{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.weather i{position:absolute;left:var(--wx);top:-6%;width:var(--ws);animation-delay:var(--wd);animation-duration:var(--wt);animation-iteration-count:infinite;animation-timing-function:linear}
.weather-rain .weather i{height:22px;background:linear-gradient(#ffffff00,#cfe4ff99);border-radius:1px;animation-name:sw-rain}
.weather-rain .world-backdrop{--bright:.9}
.weather-rain .sky-overlay{box-shadow:inset 0 0 0 100vmax #3a4a6a33}
.weather-snow .weather i{height:var(--ws);border-radius:50%;background:#fff;box-shadow:0 0 6px 1px #fff9;opacity:.9;animation-name:sw-snow}
@keyframes sw-rain{to{transform:translateY(112vh) translateX(-30px)}}
@keyframes sw-snow{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(55vh) translateX(18px)}100%{transform:translateY(112vh) translateX(-10px)}}
.student .scene-pet.cheer{animation:sw-cheer .45s ease-out 4}
.student .scene-pet.egg.cheer{animation:sw-cheer-egg .45s ease-out 4}
.student .scene-pet.droop{animation:sw-droop 1.6s ease-in-out 1}
.cheering .student .scene-pet{animation:sw-cheer .45s ease-out 5}
.cheering .student .sw-doll{animation:sw-bounce .5s ease-out 4}
@keyframes sw-cheer{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-26px) scale(1.12) rotate(-6deg)}}
@keyframes sw-cheer-egg{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-16px) rotate(8deg)}}
@keyframes sw-droop{0%,100%{transform:translateY(0) rotate(0);filter:none}40%,70%{transform:translateY(8px) rotate(-10deg);filter:saturate(.5)}}
@keyframes sw-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.class-meter{position:absolute;left:30px;top:140px;z-index:8;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:14px;background:#1b1c32b8;border:1px solid #f5d99d55;backdrop-filter:blur(14px);color:#fff;text-align:left;box-shadow:0 8px 30px #0005;max-width:250px}
.class-meter:hover{background:#2a2a48}
.meter-crest{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#ffe7a3,#c9a35a);color:#3d2f0a;flex-shrink:0;box-shadow:0 0 16px #ffd98a88}
.meter-crest svg{width:20px;height:20px}
.meter-body{display:grid;gap:5px;min-width:150px}
.meter-label{font-size:12px;font-weight:700;color:#ffe2a0;white-space:nowrap}
.meter-track{height:7px;border-radius:5px;background:#ffffff22;overflow:hidden}
.meter-fill{display:block;height:100%;background:linear-gradient(90deg,#f1cf86,#ffe7a3);box-shadow:0 0 10px #ffe7a3aa;transition:width .8s cubic-bezier(.2,1,.3,1)}
.meter-next{font-size:10px;color:#f3e9d8;white-space:nowrap}
.confetti{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;left:var(--cx);top:-4%;width:9px;height:14px;background:var(--cc);border-radius:2px;transform:rotate(var(--cr));animation:sw-confetti var(--ct) ease-in both;animation-delay:var(--cd)}
@keyframes sw-confetti{0%{transform:translateY(0) rotate(var(--cr));opacity:1}80%{opacity:1}100%{transform:translateY(112vh) rotate(calc(var(--cr) + 540deg));opacity:0}}
.fireworks{position:absolute;inset:0;z-index:35;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2a1f4a66,#0a081a99);animation:sw-fadein .4s both}
.rocket{position:absolute;left:var(--rx);top:28%;width:0;height:0;animation:sw-rocket .9s ease-out both;animation-delay:var(--rd)}
.rocket i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--rc);box-shadow:0 0 14px 4px var(--rc),0 18px 0 -3px var(--rc);transform:rotate(var(--a));animation:sw-spark 1.7s ease-out both;animation-delay:calc(var(--rd) + .9s)}
@keyframes sw-rocket{0%{transform:translateY(60vh);opacity:0}30%{opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes sw-spark{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(1.3)}100%{opacity:0;transform:rotate(var(--a)) translateY(-210px) scale(.4)}}
.fireworks-title{position:absolute;left:50%;top:58%;transform:translateX(-50%);text-align:center;color:#fff;text-shadow:0 2px 12px #000;animation:sw-floatup-slow 5s ease-out both;animation-delay:1.2s;opacity:0}
.fireworks-title .eyebrow{color:#ffe9b8}
.fireworks-title strong{display:block;font-family:Georgia,serif;font-size:clamp(34px,7vmin,64px);font-weight:500;color:#fff3d6}
.fireworks-title em{display:block;font-style:normal;font-size:14px;color:#f3e6c9;margin-top:6px}
@keyframes sw-floatup-slow{0%{opacity:0;transform:translate(-50%,20px)}15%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
@media(max-width:1120px){
.class-meter{left:20px;top:132px}
}
@media(max-width:640px){
.world:not(.home-world) .courtyard{inset:230px 0 172px}
.class-meter{left:14px;right:14px;top:auto;bottom:118px;max-width:none;padding:6px 10px 6px 7px;gap:9px;border-radius:11px}
.meter-body{gap:3px}
.meter-track{height:5px}
.meter-crest{width:28px;height:28px}
.meter-crest svg{width:15px;height:15px}
.meter-body{min-width:0}
.meter-label{font-size:11px}
.meter-next{font-size:9px}
.home-world .class-meter{display:none}
}

.world{--sw-door:36%}
.student.sw-enter{animation:sw-walkin 1.2s cubic-bezier(.33,.8,.45,1) both;animation-delay:var(--sw-in,0s)}
.student.sw-enter .sw-figure{animation:sw-walkbob .3s ease-in-out 4 both;animation-delay:var(--sw-in,0s)}
.student.sw-enter .scene-pet:not(.egg){animation:sw-trot .3s ease-in-out 4 both;animation-delay:calc(var(--sw-in,0s) + .12s)}
.student.sw-leave{animation:sw-leave .75s ease-in both;pointer-events:none}
.student.sw-wave .sw-figure{animation:sw-wave .9s ease-in-out 1}
.student .scene-pet.sw-grow{animation:sw-grow 1.4s cubic-bezier(.2,1.3,.4,1) 1}
.world-loading .student,.world-loading .student *{animation-play-state:paused!important}
.scene-pet[data-species="dragon"]{--sw-pet-idle:sw-hover 5.6s ease-in-out infinite}
.scene-pet[data-species="wolf"]{--sw-pet-idle:sw-sniff 3.4s ease-in-out infinite}
.scene-pet[data-species="sunbird"]{--sw-pet-idle:sw-flutter 2.6s ease-in-out infinite}
.scene-pet[data-species="otter"]{--sw-pet-idle:sw-sway 3.6s ease-in-out infinite}
.scene-pet[data-species="grove"]{--sw-pet-idle:sw-rock 6.4s ease-in-out infinite}
.student .scene-pet:not(.egg)[data-species="otter"],.student .scene-pet:not(.egg)[data-species="grove"],.student .scene-pet:not(.egg)[data-species="wolf"]{transform-origin:50% 92%}
@keyframes sw-walkin{from{left:50%;bottom:var(--sw-door);scale:.5;opacity:0}14%{opacity:1}}
@keyframes sw-walkbob{0%,100%{translate:0 0;rotate:0deg}25%{rotate:-1.5deg}50%{translate:0 -4%}75%{rotate:1.5deg}}
@keyframes sw-trot{0%,100%{translate:0 0}50%{translate:0 -14%}}
@keyframes sw-leave{to{opacity:0;scale:.6;translate:0 -30px}}
@keyframes sw-wave{0%,100%{rotate:0deg}20%{rotate:-4deg}45%{rotate:3.5deg}70%{rotate:-2deg}}
@keyframes sw-grow{0%{transform:scale(.6);filter:brightness(1.8) drop-shadow(0 0 18px #ffe9b8)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes sw-hover{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-14px) rotate(1deg)}}
@keyframes sw-sniff{0%,100%{transform:translateY(0) rotate(0)}12%{transform:translateY(-4px)}24%{transform:translateY(0)}36%{transform:translateY(-4px)}48%{transform:translateY(0) rotate(0)}60%{transform:translate(3px,2px) rotate(5deg)}66%{transform:translate(2px,1px) rotate(3deg)}72%{transform:translate(3px,2px) rotate(5deg)}84%{transform:translateY(0) rotate(0)}}
@keyframes sw-flutter{0%,100%{transform:translateY(0) rotate(0)}10%{transform:translateY(-6px) rotate(-2deg)}20%{transform:translateY(-2px)}30%{transform:translateY(-8px) rotate(2deg)}40%{transform:translateY(-3px)}50%{transform:translateY(-10px) rotate(0)}60%{transform:translateY(-4px) rotate(-1deg)}75%{transform:translateY(-7px)}88%{transform:translateY(-2px)}}
@keyframes sw-sway{0%,100%{transform:rotate(-5deg)}50%{transform:translateY(-3px) rotate(5deg)}}
@keyframes sw-rock{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@media(max-width:1100px){
.world:not(.home-world){--sw-door:68%}
}
@media(max-width:640px){
.world:not(.home-world){--sw-door:66%}
}
@media(prefers-reduced-motion:reduce){
.world,.world *,.world *:before,.world *:after{animation:none!important;transition:none!important}
}
.world[data-motion="reduced"],.world[data-motion="reduced"] *,.world[data-motion="reduced"] *:before,.world[data-motion="reduced"] *:after{animation:none!important;transition:none!important}

:root{
--navy:#0B1638;--card:#142453;--card-2:#1E3474;--card-deep:#101D47;--gold:#E9C27A;--gold-text:#F2D49A;--cream:#FFF6E6;
--ink:#EEF2FF;--muted:#C9D3EE;--muted-2:#B4C0E0;--line:rgba(233,194,122,.28);--line-soft:rgba(238,242,255,.12);--shadow:rgba(3,8,28,.55);
--good:#7FE0B4;--bad:#FF9AAE;
--display:"Cinzel","Trajan Pro","Georgia",serif;--text:"Nunito",system-ui,-apple-system,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{overflow-x:hidden}
body{overflow-x:clip}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.55 var(--text);background:linear-gradient(180deg,#0E1B45 0,#0B1638 40%,#0A1230 100%) fixed var(--navy)}
.sp-app{display:flex;flex-direction:column;gap:16px;max-width:720px;margin:0 auto;padding-block:max(12px,env(safe-area-inset-top,0px)) 40px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.sp-sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
img{max-width:100%}

.sp-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.sp-wordmark,.sp-hud-mark{display:block;height:40px;width:auto;padding:3px 7px;border-radius:10px;border:1px solid var(--gold);background:var(--cream);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.sp-brand{font:700 20px/1 var(--display);color:var(--gold-text);letter-spacing:.06em}
.sp-class{padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.sp-class:empty{display:none}
.sp-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;background:linear-gradient(180deg,#1E3474,#142453);border:1px solid var(--gold);color:var(--gold-text);font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px var(--shadow)}
.sp-chip-star{color:var(--gold)}
.sp-chip-word{font-weight:700;font-size:.85em;color:var(--muted)}
.sp-link{min-height:44px;padding:0 4px;border:0;background:none;color:var(--gold-text);font-weight:700;font-size:16px;text-decoration:underline;text-underline-offset:3px}
.sp-card{padding:18px;background:linear-gradient(180deg,var(--card),var(--card-deep));border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px var(--shadow)}
.sp-wait,.sp-problem p{margin:0}
.sp-problem{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.sp-big{font:700 28px/1.15 var(--display);color:var(--gold-text)}
.sp-title{margin:0;font:700 clamp(26px,7vw,36px)/1.1 var(--display);color:var(--cream);text-wrap:balance;letter-spacing:.02em;overflow-wrap:anywhere}
.sp-lead{margin:2px 0 0;color:var(--muted);font-size:18px}
.sp-h2{margin:0 0 10px;font:700 19px/1.25 var(--display);color:var(--gold-text);letter-spacing:.02em}
.sp-h3{margin:4px 0 0;font:700 16px/1.25 var(--display);color:var(--gold-text);letter-spacing:.02em}
.sp-muted{margin:0;color:var(--muted-2);font-size:14.5px}
.sp-strong{margin:0;font-weight:800;color:var(--cream)}
.sp-btn{min-height:48px;padding:10px 20px;border:0;border-radius:14px;background:linear-gradient(180deg,#F2D49A,#D9A95A);color:#2A1D05;font-weight:800;font-size:16px;box-shadow:0 3px 0 #8d6a2b,0 8px 18px var(--shadow)}
.sp-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8d6a2b}
.sp-btn-soft{background:var(--card-2);color:var(--cream);border:1px solid var(--line);box-shadow:none}

.sp-pick{display:flex;flex-direction:column;gap:12px}
.sp-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;margin-top:6px}
.sp-name{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;min-height:44px;padding:8px 6px 12px;border:1px solid var(--line-soft);border-radius:18px;background:linear-gradient(180deg,var(--card-2),var(--card));box-shadow:0 8px 18px var(--shadow)}
.sp-name:hover{border-color:var(--gold)}
.sp-name-art{width:88px;height:88px}
.sp-name-art>svg,.sp-pin-art>svg,.sp-sheet-art>svg,.sp-room-me>svg{display:block;width:100%;height:100%}
.sp-name-text{font-weight:800;font-size:16px;color:var(--cream);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-another{align-self:flex-start;margin-top:6px}
.sp-pin{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.sp-pin-art{width:120px;height:120px}
.sp-dots{display:flex;gap:16px;margin:14px 0 4px}
.sp-dot{width:20px;height:20px;border-radius:50%;border:3px solid var(--gold)}
.sp-dot-on{background:var(--gold)}
.sp-pin-msg{margin:0;min-height:1.5em;font-weight:700;color:var(--bad);max-width:34ch}
.sp-open{gap:10px}
.sp-fields{display:flex;flex-direction:column;gap:14px;width:min(100%,360px);margin-top:10px;text-align:left}
.sp-field-label{display:flex;flex-direction:column;gap:6px}
.sp-field-name{font-weight:800;font-size:15px;color:var(--gold-text);letter-spacing:.04em;text-transform:uppercase}
.sp-field{width:100%;min-height:56px;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--card-deep);color:var(--cream);font:700 22px/1.2 var(--text);letter-spacing:.04em;box-shadow:inset 0 2px 8px var(--shadow)}
.sp-field::placeholder{color:var(--muted-2);font-weight:500;font-size:17px;letter-spacing:0}
.sp-open-btn{width:min(100%,360px);margin-top:4px;font-size:18px}
.sp-open-help{max-width:40ch}
.sp-keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin-top:8px}
.sp-key{height:72px;border:1px solid var(--line-soft);border-radius:50%;background:linear-gradient(180deg,var(--card-2),var(--card));color:var(--cream);font:700 28px/1 var(--display);box-shadow:0 6px 14px var(--shadow)}
.sp-key:active{transform:translateY(2px);box-shadow:none}
.sp-key-back{font:700 24px/1 var(--text);color:var(--muted)}

.sp-app-yard{display:block;max-width:none;margin:0;padding:0}
.sp-world{position:relative;min-height:100vh;min-height:100dvh}
@media(max-width:1100px){.sp-app-yard .world:not(.home-world){position:relative}}
.sp-hud{position:absolute;top:0;left:0;right:0;z-index:9;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:12px;padding:max(20px,env(safe-area-inset-top,0px)) 28px 26px;background:linear-gradient(#0b1638c4,#0b163800);pointer-events:none}
.sp-hud>*{pointer-events:auto}
.sp-hud-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:46px;min-height:46px;padding:9px 15px;border-radius:13px;border:1px solid #ffffff38;background:#1c203ab3;color:#fff;font-weight:800;font-size:15px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

.sp-hud-sound{justify-self:start;padding:9px}
.sp-hud-room{justify-self:end;border-color:var(--gold);background:linear-gradient(180deg,#F2D49A,#D9A95A);color:#2A1D05;box-shadow:0 3px 0 #8d6a2b,0 8px 18px #0006}
.sp-hud-room:hover{background:linear-gradient(180deg,#f7dfae,#e0b46a)}
.sp-icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp-hud-title{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;text-align:center;pointer-events:none}
.sp-hud-mark{height:56px;max-width:42vw}
.sp-hud-class{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;font-size:13px;letter-spacing:.08em;color:#f3e9d8;text-shadow:0 1px 6px #000}
.sp-note{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;margin:0;padding:8px 16px;border-radius:999px;background:#1b1c32e6;border:1px solid var(--line);color:var(--cream);font-weight:800;font-size:14px}
.sp-note[hidden]{display:none}
@media(max-width:640px){
.sp-hud{padding:max(12px,env(safe-area-inset-top,0px)) 12px 18px;gap:6px}
.sp-hud-btn{min-height:44px;min-width:44px;padding:8px 11px;font-size:14px;gap:6px}
.sp-hud-sound{padding:8px}
.sp-hud-mark{height:44px;max-width:44vw}
.sp-hud-class{font-size:12px}
.sp-app-yard .world:not(.home-world) .courtyard{bottom:92px}
.sp-app-yard .world:not(.home-world) .class-meter{bottom:max(18px,env(safe-area-inset-bottom,0px))}
.sp-app-yard .world:not(.home-world) .student{--size:clamp(102px,calc((var(--stage-height) - 290px)/3 - 56px),134px)!important}
.sp-note{bottom:max(78px,calc(env(safe-area-inset-bottom,0px) + 64px))}
}

@media(max-width:1100px){
.sp-app-yard.sp-app-yard .sp-many .world:not(.home-world){--stage-height:max(100dvh,calc(502px + (var(--sp-rows,4) - 1) * 145px))}
.sp-app-yard .sp-many .world:not(.home-world) .courtyard{top:auto;bottom:92px;height:calc((var(--sp-rows,4) - 1) * 217px)}
.sp-app-yard.sp-app-yard .sp-many .world:not(.home-world) .student{--size:120px!important}
}
@media(min-width:1101px){

.sp-app-yard .sp-many .student-sparkles{padding:4px 9px}
.sp-app-yard .sp-many .student-sparkles>b{font-size:18px}

function signOut() { ++S.request; S.busy = false; var m = saved(); delete m.session; delete m.studentId; save(m); S.board = null; names(); }

var CARE = P.CARE;
var REACTIONS = {pet: ['♥', 'enjoyed a gentle pat.'], water: ['💧', 'had a refreshing drink.'], snack: ['🍎', 'enjoyed the snack.'], walk: ['🐾', 'took a little stroll with you.']};

}

}
