<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPARKADE</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B1638">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* SPARKADE, the pupils' page, in the look book's colours: deep navy, warm gold, cream text; Cinzel for the big words
   (the wordmark's serif), Nunito for everything a young reader has to read. One dark theme on every device; solid
   fallbacks for forced colours; no motion for reduced motion. */
:root{
  --navy:#0B1638;--card:#142453;--card-2:#1E3474;--card-deep:#101D47;--gold:#E9C27A;--gold-text:#F2D49A;--cream:#FFF6E6;
  --ink:#EEF2FF;--muted:#C9D3EE;--muted-2:#B4C0E0;--line:rgba(233,194,122,.28);--line-soft:rgba(238,242,255,.12);--shadow:rgba(3,8,28,.55);
  --good:#7FE0B4;--bad:#FF9AAE;--spark:#E9C27A;
  --display:"Cinzel","Trajan Pro","Georgia",serif;--text:"Nunito",system-ui,-apple-system,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.55 var(--text);background-color:var(--navy);
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,246,230,.9) 50%,transparent 51%),radial-gradient(1px 1px at 78% 9%,rgba(255,246,230,.8) 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 58% 32%,rgba(255,246,230,.7) 50%,transparent 51%),radial-gradient(1px 1px at 32% 62%,rgba(255,246,230,.6) 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 88% 54%,rgba(255,246,230,.7) 50%,transparent 51%),radial-gradient(1px 1px at 18% 86%,rgba(255,246,230,.6) 50%,transparent 51%),
    radial-gradient(1px 1px at 66% 80%,rgba(255,246,230,.7) 50%,transparent 51%),linear-gradient(180deg,#0E1B45 0,#0B1638 40%,#0A1230 100%);
  background-attachment:fixed}
.sp-app{display:flex;flex-direction:column;gap:16px;max-width:720px;margin:0 auto;padding-block:max(12px,env(safe-area-inset-top,0px)) 40px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.sp-sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
img{max-width:100%}

.sp-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.sp-top-right{display:flex;align-items:center;gap:8px}
.sp-wordmark{display:block;height:40px;width:auto;padding:3px 7px;border-radius:10px;border:1px solid var(--gold);background:var(--cream);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.sp-brand{font:700 20px/1 var(--display);color:var(--gold-text);letter-spacing:.06em}
.sp-brand-star{color:var(--gold)}
.sp-class{padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.sp-class:empty{display:none}
.sp-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;background:linear-gradient(180deg,#1E3474,#142453);border:1px solid var(--gold);color:var(--gold-text);font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 4px 14px var(--shadow)}
.sp-chip-star{color:var(--gold)}
.sp-link{min-height:44px;padding:0 4px;border:0;background:none;color:var(--gold-text);font-weight:700;font-size:16px;text-decoration:underline;text-underline-offset:3px}
.sp-card{padding:18px;background:linear-gradient(180deg,var(--card),var(--card-deep));border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px var(--shadow)}
.sp-wait p,.sp-problem p{margin:0}
.sp-problem{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.sp-big{font:700 28px/1.1 var(--display);color:var(--gold-text)}
.sp-title{margin:0;font:700 clamp(26px,7vw,36px)/1.1 var(--display);color:var(--cream);text-wrap:balance;letter-spacing:.02em}
.sp-lead{margin:2px 0 0;color:var(--muted);font-size:18px}
.sp-h2{margin:0 0 10px;font:700 19px/1.25 var(--display);color:var(--gold-text);letter-spacing:.02em}
.sp-h3{margin:14px 0 8px;font:700 16px/1.25 var(--display);color:var(--gold-text);letter-spacing:.02em}
.sp-muted{margin:0;color:var(--muted-2);font-size:14.5px}
.sp-strong{margin:0;font-weight:800;color:var(--cream)}
.sp-btn{min-height:48px;padding:10px 20px;border:0;border-radius:14px;background:linear-gradient(180deg,#F2D49A,#D9A95A);color:#2A1D05;font-weight:800;font-size:16px;box-shadow:0 3px 0 #8d6a2b,0 8px 18px var(--shadow)}
.sp-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8d6a2b}
.sp-btn-soft{background:var(--card-2);color:var(--cream);border:1px solid var(--line);box-shadow:none}

/* Who are you? */
.sp-pick{display:flex;flex-direction:column;gap:12px}
.sp-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px;margin-top:6px}
.sp-name{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;padding:10px 8px 12px;border:1px solid var(--line-soft);border-radius:18px;background:linear-gradient(180deg,var(--card-2),var(--card));box-shadow:0 8px 18px var(--shadow);transition:transform .12s ease,border-color .12s ease}
.sp-name:hover{transform:translateY(-2px);border-color:var(--gold)}
.sp-name-art{width:72px;height:96px}
.sp-name-art>svg,.sp-pin-art>svg,.sp-sticker-art>svg,.sp-castle-me>svg{display:block;width:100%;height:100%}
.sp-name-text{font-weight:800;font-size:16px;color:var(--cream);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Your PIN */
.sp-pin{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.sp-pin-art{width:96px;height:128px}
.sp-dots{display:flex;gap:16px;margin:14px 0 4px}
.sp-dot{width:20px;height:20px;border-radius:50%;border:3px solid var(--gold);background:transparent;transition:background .1s ease}
.sp-dot-on{background:var(--gold)}
.sp-pin-msg{margin:0;min-height:1.5em;font-weight:700;color:var(--bad);max-width:34ch}
.sp-open{gap:10px}
.sp-fields{display:flex;flex-direction:column;gap:14px;width:min(100%,360px);margin-top:10px;text-align:left}
.sp-field-label{display:flex;flex-direction:column;gap:6px}
.sp-field-name{font-weight:800;font-size:15px;color:var(--gold-text);letter-spacing:.04em;text-transform:uppercase}
.sp-field{width:100%;min-height:56px;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--card-deep);color:var(--cream);font:700 22px/1.2 var(--text);letter-spacing:.04em;box-shadow:inset 0 2px 8px var(--shadow)}
.sp-field::placeholder{color:var(--muted-2);font-weight:500;font-size:17px;letter-spacing:0;text-transform:none}
.sp-open-btn{width:min(100%,360px);margin-top:4px;font-size:18px}
.sp-open-msg{min-height:1.5em}
.sp-open-help{max-width:40ch}
.sp-keys{display:grid;grid-template-columns:repeat(3,74px);gap:12px;margin-top:8px}
.sp-key{height:74px;border:1px solid var(--line-soft);border-radius:50%;background:linear-gradient(180deg,var(--card-2),var(--card));color:var(--cream);font:700 28px/1 var(--display);box-shadow:0 6px 14px var(--shadow)}
.sp-key:active{transform:translateY(2px);box-shadow:none}
.sp-key-back{font:700 24px/1 var(--text);color:var(--muted)}

/* The castle */
.sp-castle{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);box-shadow:0 14px 34px var(--shadow);background:#1a2650;min-height:240px}
.sp-castle-bg{display:block;width:100%;height:auto;aspect-ratio:640/421;object-fit:cover}
.sp-castle-plain{aspect-ratio:640/421;background:linear-gradient(180deg,#2a3f8a,#15224f)}
.sp-castle-scene{position:absolute;left:0;right:0;bottom:0;height:62%;pointer-events:none}
.sp-castle-me{position:absolute;left:5%;bottom:4%;width:22%;max-width:130px;aspect-ratio:120/160;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.sp-castle-pet{position:absolute;right:4%;bottom:0;width:40%;max-width:230px;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.sp-castle-pet .sp-cart-pic{border:0;background:none;border-radius:0;-webkit-mask-image:radial-gradient(ellipse 62% 60% at 50% 58%,#000 58%,transparent 82%);mask-image:radial-gradient(ellipse 62% 60% at 50% 58%,#000 58%,transparent 82%)}
.sp-castle-pet .sp-cart-standin{background:none;border:0}
.sp-castle-pet .sp-cart-tag{display:none}
.sp-castle-pet .sp-cart-glow{width:88%;height:88%}
.sp-castle-egg{width:22%;max-width:120px;right:9%}
.sp-castle-copy{position:absolute;left:0;right:0;top:0;padding:12px 16px 40px;background:linear-gradient(180deg,rgba(11,22,56,.78) 0,rgba(11,22,56,.45) 60%,transparent 100%);pointer-events:none}
.sp-me{margin:0;font:700 clamp(24px,6.5vw,34px)/1.1 var(--display);color:var(--cream);letter-spacing:.03em;text-shadow:0 2px 8px rgba(0,0,0,.6);overflow-wrap:anywhere}
.sp-points{margin:2px 0 0;display:flex;align-items:baseline;gap:6px;font:800 clamp(30px,8vw,44px)/1 var(--text);font-variant-numeric:tabular-nums;color:var(--gold-text);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.sp-star{color:var(--gold)}
.sp-points-word{font:700 17px/1 var(--text);color:var(--muted)}
.sp-count{display:inline-block;transform-origin:50% 80%;margin-right:2px}
.sp-gained{margin:4px 0 0;display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(242,212,154,.18);border:1px solid var(--gold);color:var(--gold-text);font-weight:800;font-size:14px}
.sp-wallet{margin:4px 0 0;color:var(--muted);font-weight:700;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.sp-board-status{margin:0;color:var(--muted);font-size:15px}
.sp-board-status:empty{display:none}

/* The companion */
.sp-companion{position:relative}
.sp-crow{display:flex;align-items:center;gap:14px}
.sp-ccopy{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:6px}
.sp-egg-btn{position:relative;flex:none;width:min(40vw,168px);padding:0;border:0;background:none;border-radius:18px}
.sp-cart{display:block;width:100%;aspect-ratio:1;overflow:hidden;border-radius:18px}
.sp-cart-pic{background:radial-gradient(circle at 50% 60%,#1E3474,#0d1839 75%);border:1px solid var(--line-soft)}
.sp-cimg{display:block;width:100%;height:100%;object-fit:cover}
.sp-cart-standin{position:relative;display:flex;align-items:center;justify-content:center;border:2px dashed var(--gold);background:radial-gradient(circle at 50% 45%,rgba(233,194,122,.16),rgba(11,22,56,.2) 70%)}
.sp-cart-glow{display:block;width:72%;height:72%}
.sp-cart-glow>svg{display:block;width:100%;height:100%}
.sp-cart-tag{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);white-space:nowrap;padding:3px 10px;border-radius:999px;background:var(--gold);color:#2A1D05;font-weight:800;font-size:12px}
.sp-care-reaction{position:absolute;right:6px;top:4px;font-size:30px;line-height:1.2;animation:sp-float 2.2s ease-out forwards}
@keyframes sp-float{0%{transform:translateY(6px);opacity:0}15%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
.sp-wobble{animation:sp-wobble .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes sp-wobble{0%,100%{transform:none}30%{transform:rotate(-5deg) translateY(-6px)}60%{transform:rotate(4deg)}}
.sp-care-walk{animation:sp-stroll 2.2s ease-in-out}
@keyframes sp-stroll{0%,100%{transform:translateX(0)}50%{transform:translateX(-26px)}}
.sp-stages{display:inline-flex;gap:7px}
.sp-stage-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);background:transparent}
.sp-stage-on{background:var(--gold);box-shadow:0 0 10px rgba(233,194,122,.7)}
.sp-tonight{color:var(--gold-text)}
.sp-grew{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 36px rgba(233,194,122,.35),0 10px 30px var(--shadow)}
.sp-grew-line{margin:-4px 0 10px;padding:8px 12px;border-radius:12px;background:rgba(242,212,154,.14);border:1px solid var(--gold);color:var(--gold-text);font-weight:800}
.sp-grew .sp-cart{animation:sp-born .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes sp-born{0%{filter:brightness(2.4);transform:scale(.7)}100%{filter:none;transform:none}}
.sp-bar{height:12px;border-radius:999px;background:rgba(238,242,255,.12);overflow:hidden}
.sp-bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#D9A95A,#F2D49A)}
.sp-egg-goal{display:flex;align-items:center;gap:14px}
.sp-egg-goal-art{flex:none;width:92px;height:92px}
.sp-egg-goal-art>svg{display:block;width:100%;height:100%}
.sp-egg-goal-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.sp-care{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
.sp-care-msg{margin:0;font-weight:800;color:var(--cream)}
.sp-care-actions{display:flex;flex-wrap:wrap;gap:8px}
.sp-care-actions .sp-btn{min-height:44px;padding:8px 16px;font-size:15px}
.sp-care-btn{position:relative}
.sp-care-done{border-color:var(--gold);color:var(--gold-text)}
.sp-care-done::after{content:" ✓";font-weight:900}
.sp-care-count{margin:0;font-size:13px;color:var(--muted)}
.sp-mood{margin:0;font-weight:800;color:var(--gold-text)}
.sp-mood-missing{color:var(--muted)}
.sp-care-all{margin:0;padding:8px 12px;border-radius:12px;background:rgba(242,212,154,.14);border:1px solid var(--gold);color:var(--gold-text);font-weight:800}
.sp-care-glow{animation:sp-glow 1.6s ease-out}
@keyframes sp-glow{0%{box-shadow:0 0 0 1px var(--gold),0 0 48px rgba(233,194,122,.6)}100%{box-shadow:none}}

/* Meet the companions */
.sp-meet-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sp-meet-btn{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;padding:4px;border:1px solid transparent;border-radius:14px;background:none}
.sp-meet-btn .sp-cart{border-radius:12px}
.sp-meet-on{border-color:var(--gold);background:rgba(233,194,122,.1)}
.sp-meet-name{font-size:11px;font-weight:800;color:var(--muted);text-align:center;line-height:1.15}
.sp-meet-open{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.sp-meet-stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sp-meet-stage{display:flex;flex-direction:column;align-items:center;gap:3px}
.sp-meet-stage .sp-cart{border-radius:10px}
.sp-meet-stage .sp-cart-tag{font-size:9px;padding:2px 6px;bottom:4px}
.sp-meet-stage-name{font-size:10.5px;font-weight:800;color:var(--muted);text-align:center;line-height:1.15}

/* The class goal */
.sp-jar{display:flex;align-items:center;gap:16px}
.sp-jar-art{flex:none;width:100px}
.sp-jar-art svg{display:block;width:100%;height:auto}
.sp-jar-copy{min-width:0}
.sp-jar-copy .sp-h2{margin-bottom:4px}
.sp-jar-count{margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
.sp-jar-count strong{font:800 26px/1 var(--text);color:var(--gold-text)}
.sp-jar-left{margin:4px 0 0;font-weight:800;color:var(--cream)}

/* My Sparkles */
.sp-history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sp-hist{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft)}
.sp-hist:first-child{border-top:0}
.sp-hist-icon{font-size:24px;text-align:center}
.sp-hist-label{display:flex;flex-direction:column;min-width:0}
.sp-hist-label strong{font-weight:800;color:var(--cream)}
.sp-hist-label span{font-size:14px;color:var(--muted-2)}
.sp-hist-pts{font:800 22px/1 var(--text);color:var(--good);font-variant-numeric:tabular-nums}
.sp-hist-neg .sp-hist-pts{color:var(--bad)}

/* My class */
.sp-class-board{display:flex;flex-direction:column;gap:4px}
.sp-stickers{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.sp-sticker{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 10px;background:var(--card-2);border:1px solid var(--line-soft);border-radius:16px}
.sp-sticker-me{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.sp-sticker-art{width:64px;height:86px}
.sp-sticker-pet{position:absolute;right:6px;top:6px;width:38px}
.sp-sticker-pet .sp-cart{border-radius:10px}
.sp-sticker-pet .sp-cart-tag{display:none}
.sp-sticker-name{font-weight:800;font-size:15px;color:var(--cream);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-sticker-pts{font:800 16px/1 var(--text);color:var(--gold-text);font-variant-numeric:tabular-nums}
.sp-sticker-pts.sp-neg{color:var(--bad)}
.sp-sticker-stage{font-size:11.5px;font-weight:800;color:var(--muted)}

/* Coming soon, and the end */
.sp-soon{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sp-soon-tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
.sp-soon-name{font:700 14px/1.2 var(--display);color:var(--gold-text);letter-spacing:.02em}
.sp-soon-tag{font-size:11.5px;font-weight:800}
.sp-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

/* The avatar maker is a local preview; the gold action displays a teacher code. */
.sp-wardrobe-entry{min-height:72px;background:var(--card-2);border:1px solid var(--gold)}
.sp-wardrobe-entry:hover{background:#29448A}
.sp-wardrobe{display:flex;flex-direction:column;gap:12px}
.sp-avatar-studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start;margin-top:4px}
.sp-avatar-stage{position:relative;min-width:0;aspect-ratio:1/1.22;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 68%,#335197 0,#1B2C61 44%,#101D47 80%)}
.sp-avatar-preview-tag{position:absolute;z-index:1;left:12px;top:12px;color:var(--gold-text);font-size:13px;font-weight:800}
.sp-avatar-preview-art{position:absolute;left:-11%;bottom:4%;width:112%;aspect-ratio:1;filter:drop-shadow(0 8px 10px rgba(3,8,28,.4))}
.sp-avatar-preview-art>svg{display:block;width:100%;height:100%}
.sp-avatar-preview-companion{position:absolute;right:1%;bottom:4%;width:35%;filter:drop-shadow(0 5px 6px rgba(3,8,28,.4))}
.sp-avatar-preview-companion .sp-cart-pic{background:none;border:0}
.sp-avatar-controls{display:flex;flex-direction:column;gap:16px;min-width:0}
.sp-avatar-group{border:0;margin:0;padding:0;min-width:0}
.sp-avatar-group legend{padding:0;margin:0 0 8px;color:var(--gold-text);font-weight:800;font-size:16px}
.sp-avatar-options{display:flex;flex-wrap:wrap;gap:8px}
.sp-avatar-choice{min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card-deep);color:var(--cream);font-weight:700;font-size:14px;text-align:left}
.sp-avatar-choice:hover{border-color:var(--gold)}
.sp-avatar-choice-on{background:var(--gold);border-color:var(--gold);color:#2A1D05;box-shadow:inset 0 0 0 2px var(--card-deep)}
.sp-avatar-actions{display:flex;flex-wrap:wrap;gap:10px}
.sp-avatar-code-box{padding:16px;border:1px solid var(--gold);border-radius:14px;background:var(--card-deep)}
.sp-avatar-code-box[hidden]{display:none}
.sp-avatar-code{display:block;margin:4px 0 12px;font:800 clamp(18px,4.5vw,26px)/1.4 var(--text);letter-spacing:.04em;color:var(--cream);overflow-wrap:anywhere;user-select:all}

@media (max-width:540px){.sp-avatar-studio{grid-template-columns:minmax(0,1fr);gap:16px}.sp-avatar-stage{width:min(100%,300px);justify-self:center;aspect-ratio:1}.sp-avatar-preview-art{left:-5%;width:95%;bottom:2%}.sp-avatar-preview-companion{width:32%;right:1%;bottom:3%}.sp-avatar-actions>.sp-btn{flex:1 1 180px}}
@media (forced-colors:active){.sp-avatar-stage,.sp-avatar-choice,.sp-avatar-code-box{border:1px solid CanvasText}.sp-avatar-choice-on{outline:3px solid Highlight}}

@media (max-width:420px){.sp-keys{grid-template-columns:repeat(3,68px)}.sp-key{height:68px}.sp-crow{flex-wrap:wrap}.sp-egg-btn{width:min(44vw,160px)}.sp-top{flex-wrap:wrap}.sp-wordmark{height:32px}.sp-castle-copy{padding-bottom:30px}.sp-stickers{grid-template-columns:repeat(auto-fill,minmax(94px,1fr))}.sp-meet-row{grid-template-columns:repeat(5,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (forced-colors:active){.sp-card,.sp-sticker,.sp-name,.sp-castle,.sp-soon-tile{border:1px solid CanvasText}.sp-meet-on{outline:3px solid Highlight}.sp-stage-on{background:Highlight}}

/* Preserve the existing avatar breathing/blinking motion. */
.pa-figure-breathe,.pa-pet-breathe{transform-box:fill-box;transform-origin:center bottom;animation:pa-breathe 4s ease-in-out infinite}
.pa-blink{transform-box:fill-box;transform-origin:center;animation:pa-blink 5.5s infinite}
@keyframes pa-breathe{50%{transform:scale(1.015,1.025)}}
@keyframes pa-blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
@media (prefers-reduced-motion:reduce){.pa-figure-breathe,.pa-pet-breathe,.pa-blink{animation:none!important}}

<body>
<main class="sp-app" id="sp-app">
  <div class="sp-card sp-wait" role="status"><p>Opening SPARKADE…</p></div>
</main>
<p class="sp-sr" id="sp-live" role="status" aria-live="polite"></p>
<script>
/* Spark Education Portal · points core: the rules behind Teaching › Points and the students' home page, with no page code,
 * so the teacher board, the student page and the server (PortalPoints.gs) all count the same way, and the rules can be
 * tested on their own (pilot/tests/points.test.cjs). Written in the plain style of the .gs files so Code.gs can carry it.
 *
 * Data contract:
 * - An award is {studentId, points, at (ISO time), undone}. A student's points are the sum of their awards that are not
 *   undone; points can go below zero ("needs work" awards are negative).
 * - A student's creature grows with their peak: the highest their running total has ever been, in time order. A creature
 *   never shrinks back after a minus point; it waits until the points climb past the peak again.
 * - A creature is "species-colour", for example "bun-sky". Anything else is drawn as the default creature.
 * - The class goal (the marble jar) counts the class's points since the goal started, never below zero.
 */
var PointsCore = (function () {
  'use strict';
  // Points needed for levels 1 to 10; from level 10 every 50 more points is another level.
  var LEVELS = [0, 5, 15, 30, 50, 75, 105, 140, 180, 225];
  var AFTER_TEN = 50;
  var STAGE_NAMES = ['Egg', 'Baby', 'Little', 'Big', 'Super', 'Legend'];
  var SPECIES = [['blob', 'Blobby'], ['sprout', 'Sprout'], ['bun', 'Bunny'], ['spike', 'Spiky'], ['cloud', 'Puff'], ['drop', 'Drip'], ['kitty', 'Kitty'], ['dragon', 'Dragon']];
  // [name, body, shade, light]
  var COLOURS = [
    ['coral', '#ff8a7a', '#de6456', '#ffd6cd'], ['sun', '#ffcd45', '#e3a320', '#fff1c2'], ['mint', '#6ad4ad', '#3fae88', '#cff3e5'],
    ['sky', '#6db6ff', '#4689d8', '#d5eaff'], ['grape', '#b28dff', '#8a62e0', '#e9deff'], ['peach', '#ffb27a', '#e48b4e', '#ffe3cc'],
    ['lime', '#a6dd60', '#7fb937', '#e6f7cd'], ['berry', '#ff7db5', '#dd558d', '#ffd5e7']
  ];
  var INK = '#1d2433';
  // Pictures a button can have: the first row for well done, the second for needs work (the older ones stay valid).
  var ICONS = ['⭐', '🌟', '🙋', '🤝', '💪', '📚', '📖', '✏️', '🗣️', '🙌', '👏', '👍', '🏆', '🥇', '🎯', '🧠', '💡', '🎨', '🎵', '❤️', '😊', '🎉', '🔥', '🚀', '⚡', '🧹', '🦸', '🌈', '👂',
    '💬', '💤', '📭', '⏰', '📵', '🔇', '🙊', '😴', '🐢', '📱', '🚫', '⚠️', '👎', '❌', '🗑️', '🍬', '🏃', '😡'];
  // What a pupil earns: one word everywhere a number of points is shown.
  var CURRENCY = { one: 'Sparkle', many: 'Sparkles' };
  // Names a teacher can tap when making a new button.
  var IDEAS = { plus: [['Great answer', '⭐'], ['Helping others', '🤝'], ['Hard work', '💪'], ['Homework done', '📚'], ['Speaking English', '🗣️'], ['Teamwork', '🙌'], ['Great reading', '📖'], ['Perfect score', '🏆'], ['Kind words', '❤️'], ['Tidy desk', '🧹'], ['Creative idea', '💡'], ['Listening well', '👂']],
    minus: [['Speaking Korean', '💬'], ['Off task', '💤'], ['No homework', '📭'], ['Late', '⏰'], ['Phone out', '📵'], ['Too noisy', '🔇'], ['Unkind words', '🙊'], ['Running inside', '🏃']] };
  var DEFAULT_BEHAVIOURS = [
    ['Great answer', 1, '⭐'], ['Helping others', 1, '🤝'], ['Hard work', 1, '💪'], ['Homework done', 1, '📚'],
    ['Speaking English', 1, '🗣️'], ['Teamwork', 1, '🙌'], ['Great reading', 1, '📖'], ['Perfect score', 2, '🏆'],
    ['Speaking Korean', -1, '💬'], ['Off task', -1, '💤'], ['No homework', -1, '📭'], ['Late', -1, '⏰']
  ];

  function levelFor(peak) {
    var p = Math.max(0, Math.floor(Number(peak) || 0)), level = 1, floor = 0, next;
    for (var i = LEVELS.length - 1; i >= 0; i--) { if (p >= LEVELS[i]) { level = i + 1; floor = LEVELS[i]; break; } }
    if (level === LEVELS.length) {
      var extra = Math.floor((p - LEVELS[LEVELS.length - 1]) / AFTER_TEN);
      level += extra; floor = LEVELS[LEVELS.length - 1] + extra * AFTER_TEN; next = floor + AFTER_TEN;
    } else next = LEVELS[level];
    var stage = stageFor(level);
    return { level: level, floor: floor, next: next, toNext: next - p, progress: Math.min(1, (p - floor) / (next - floor)), stage: stage, stageName: STAGE_NAMES[stage],
      // The points at which this creature next changes shape (not just level), or null for a Legend.
      nextStageAt: stage >= 5 ? null : LEVELS[[1, 3, 5, 7, 9][stage]] };
  }
  // Adjustable launch defaults. Positive, non-undone awards grow land; purchases and minus points do not.
  var ISLAND_STAGES = [0, 50, 150, 300];
  function islandFor(earned) {
    var value = Number(earned), stage = 0;
    value = isFinite(value) ? Math.max(0, Math.floor(value)) : 0;
    for (var i = 1; i < ISLAND_STAGES.length; i++) if (value >= ISLAND_STAGES[i]) stage = i;
    var next = ISLAND_STAGES[stage + 1];
    return { earned: value, stage: stage, next: next === undefined ? null : next,
      progress: next === undefined ? 1 : (value - ISLAND_STAGES[stage]) / (next - ISLAND_STAGES[stage]) };
  }
  function stageFor(level) { return level <= 1 ? 0 : level <= 3 ? 1 : level <= 5 ? 2 : level <= 7 ? 3 : level <= 9 ? 4 : 5; }

  /* Totals in time order: points (the sum) and peak (the highest the running total has been). Undone awards are left out. */
  function totals(awards) {
    var list = (awards || []).filter(function (a) { return a && !a.undone && a.studentId; }).slice();
    list.sort(function (a, b) { return String(a.at).localeCompare(String(b.at)); });
    var out = {};
    list.forEach(function (a) {
      var t = out[a.studentId] || (out[a.studentId] = { points: 0, peak: 0, plus: 0, minus: 0, count: 0 });
      var n = Number(a.points) || 0;
      t.points += n; t.count++;
      if (n > 0) t.plus += n; else t.minus -= n;
      if (t.points > t.peak) t.peak = t.points;
    });
    return out;
  }
  function goalProgress(awards, since) {
    var start = String(since || ''), sum = 0;
    (awards || []).forEach(function (a) { if (a && !a.undone && String(a.at) >= start) sum += Number(a.points) || 0; });
    return Math.max(0, sum);
  }

  function creatureParts(code) {
    var m = /^([a-z]+)-([a-z]+)$/.exec(String(code || ''));
    var species = m && SPECIES.some(function (s) { return s[0] === m[1]; }) ? m[1] : 'blob';
    var colour = m && COLOURS.some(function (c) { return c[0] === m[2]; }) ? m[2] : 'sky';
    return { species: species, colour: colour, code: species + '-' + colour, valid: !!m && species === m[1] && colour === m[2] };
  }
  function validCreature(code) { return creatureParts(code).valid; }
  /* A starting creature that differs from its neighbours': species and colour step through their lists. */
  function creatureFor(index) {
    var i = Math.max(0, Math.floor(Number(index) || 0));
    return SPECIES[i % SPECIES.length][0] + '-' + COLOURS[(i * 3 + Math.floor(i / SPECIES.length)) % COLOURS.length][0];
  }
  function speciesName(code) { var p = creatureParts(code); return SPECIES.filter(function (s) { return s[0] === p.species; })[0][1]; }

  /* ---------- Drawing (SVG text; every value in it comes from the lists above, never from what someone typed) ---------- */
  function n(v) { return Math.round(v * 10) / 10; }
  function ell(cx, cy, rx, ry, fill, extra) { return '<ellipse cx="' + n(cx) + '" cy="' + n(cy) + '" rx="' + n(rx) + '" ry="' + n(ry) + '" fill="' + fill + '"' + (extra || '') + '/>'; }
  function circ(cx, cy, r, fill, extra) { return '<circle cx="' + n(cx) + '" cy="' + n(cy) + '" r="' + n(r) + '" fill="' + fill + '"' + (extra || '') + '/>'; }
  function path(d, fill, extra) { return '<path d="' + d + '" fill="' + fill + '"' + (extra || '') + '/>'; }
  function rot(deg, x, y) { return ' transform="rotate(' + n(deg) + ' ' + n(x) + ' ' + n(y) + ')"'; }

  /* The silhouette: everything that gets the white sticker edge. paint(role) gives the colour of each part. */
  function silhouette(species, stage, g, paint) {
    var s = g.s, cx = g.cx, cy = g.cy, rx = g.rx, ry = g.ry, out = [];
    if (stage >= 4 && species !== 'dragon') { // wings behind the body
      out.push(ell(cx - rx - 5 * s, cy - 8 * s, 13 * s, 7.5 * s, paint('wing'), rot(-28, cx - rx - 5 * s, cy - 8 * s)));
      out.push(ell(cx + rx + 5 * s, cy - 8 * s, 13 * s, 7.5 * s, paint('wing'), rot(28, cx + rx + 5 * s, cy - 8 * s)));
    }
    if (species === 'dragon') { // bat wings that grow with the dragon, and a tail
      var k = 0.75 + stage * 0.12;
      [-1, 1].forEach(function (d) {
        var bx = cx + d * (rx - 4 * s), by = cy - 6 * s;
        out.push(path('M' + n(bx) + ' ' + n(by) + ' L' + n(bx + d * 20 * s * k) + ' ' + n(by - 16 * s * k) + ' L' + n(bx + d * 16 * s * k) + ' ' + n(by - 3 * s * k) +
          ' L' + n(bx + d * 22 * s * k) + ' ' + n(by + 2 * s * k) + ' L' + n(bx + d * 13 * s * k) + ' ' + n(by + 8 * s * k) + ' Z', paint('shade')));
      });
      out.push(path('M' + n(cx + rx * 0.55) + ' ' + n(cy + ry * 0.4) + ' Q' + n(cx + rx + 16 * s) + ' ' + n(cy + ry * 1.05) + ' ' + n(cx + rx + 17 * s) + ' ' + n(cy - ry * 0.05) +
        ' L' + n(cx + rx + 11 * s) + ' ' + n(cy + ry * 0.2) + ' Q' + n(cx + rx + 7 * s) + ' ' + n(cy + ry * 0.62) + ' ' + n(cx + rx * 0.55) + ' ' + n(cy + ry * 0.8) + ' Z', paint('body')));
      out.push(path('M' + n(cx + rx + 17 * s) + ' ' + n(cy - ry * 0.05) + ' l' + n(-7 * s) + ' ' + n(-4 * s) + ' l' + n(2 * s) + ' ' + n(9 * s) + ' Z', paint('shade')));
      [-1, 1].forEach(function (d) { out.push(path('M' + n(cx + d * 13 * s) + ' ' + n(cy - ry + 4 * s) + ' L' + n(cx + d * 10 * s) + ' ' + n(cy - ry - 9 * s) + ' L' + n(cx + d * 5 * s) + ' ' + n(cy - ry + 1 * s) + ' Z', paint('horn'))); });
    }
    if (species === 'kitty') {
      [-1, 1].forEach(function (d) { out.push(path('M' + n(cx + d * 22 * s) + ' ' + n(cy - ry * 0.5) + ' L' + n(cx + d * 16 * s) + ' ' + n(cy - ry - 12 * s) + ' L' + n(cx + d * 4 * s) + ' ' + n(cy - ry * 0.93) + ' Z', paint('body'))); });
    }
    if (species === 'bun') {
      var earH = stage === 1 ? 9 : 19;
      out.push(ell(cx - 11 * s, cy - ry - earH * s * 0.55, 7 * s, earH * s, paint('body'), rot(-10, cx - 11 * s, cy - ry)));
      out.push(ell(cx + 11 * s, cy - ry - earH * s * 0.55, 7 * s, earH * s, paint('body'), rot(10, cx + 11 * s, cy - ry)));
    }
    if (species === 'sprout') {
      out.push(path('M' + n(cx) + ' ' + n(cy - ry + 2) + ' Q' + n(cx + 2 * s) + ' ' + n(cy - ry - 8 * s) + ' ' + n(cx) + ' ' + n(cy - ry - 13 * s), 'none', ' stroke="' + paint('stem') + '" stroke-width="' + n(3 * s) + '" stroke-linecap="round"'));
      out.push(path(leaf(cx, cy - ry - 12 * s, 11 * s, 1), paint('leaf')));
      if (stage >= 3) out.push(path(leaf(cx, cy - ry - 10 * s, 9 * s, -1), paint('leaf')));
    }
    if (species === 'spike') {
      var count = 2 + stage, a0 = Math.PI * 1.12, a1 = Math.PI * 1.88;
      for (var i = 0; i < count; i++) {
        var a = a0 + (a1 - a0) * (count === 1 ? 0.5 : i / (count - 1)), bx = cx + Math.cos(a) * rx * 0.86, by = cy + Math.sin(a) * ry * 0.86;
        var w = 0.22, tip = 15 * s;
        out.push(path('M' + n(cx + Math.cos(a - w) * rx * 0.92) + ' ' + n(cy + Math.sin(a - w) * ry * 0.92) + ' L' + n(bx + Math.cos(a) * tip) + ' ' + n(by + Math.sin(a) * tip) +
          ' L' + n(cx + Math.cos(a + w) * rx * 0.92) + ' ' + n(cy + Math.sin(a + w) * ry * 0.92) + ' Z', paint('shade')));
      }
    }
    if (stage >= 2) { // feet
      out.push(ell(cx - 12 * s, cy + ry - 3 * s, 8.5 * s, 5.5 * s, paint('shade')));
      out.push(ell(cx + 12 * s, cy + ry - 3 * s, 8.5 * s, 5.5 * s, paint('shade')));
    }
    if (stage >= 3) { // arms
      out.push(ell(cx - rx + 1 * s, cy + 5 * s, 6 * s, 10 * s, paint('body'), rot(28, cx - rx + 1 * s, cy + 5 * s)));
      out.push(ell(cx + rx - 1 * s, cy + 5 * s, 6 * s, 10 * s, paint('body'), rot(-28, cx + rx - 1 * s, cy + 5 * s)));
    }
    if (species === 'cloud') {
      out.push(circ(cx - 17 * s, cy - 4 * s, 16 * s, paint('body')), circ(cx + 17 * s, cy - 4 * s, 16 * s, paint('body')),
        circ(cx - 7 * s, cy - 15 * s, 17 * s, paint('body')), circ(cx + 9 * s, cy - 14 * s, 15 * s, paint('body')), ell(cx, cy + 4 * s, rx, ry * 0.8, paint('body')));
    } else if (species === 'drop') {
      out.push(path('M' + n(cx) + ' ' + n(cy - ry - 13 * s) + ' C' + n(cx + rx * 0.28) + ' ' + n(cy - ry * 0.95) + ' ' + n(cx + rx * 1.02) + ' ' + n(cy - ry * 0.55) + ' ' + n(cx + rx * 1.02) + ' ' + n(cy + ry * 0.18) +
        ' C' + n(cx + rx * 1.02) + ' ' + n(cy + ry * 1.08) + ' ' + n(cx - rx * 1.02) + ' ' + n(cy + ry * 1.08) + ' ' + n(cx - rx * 1.02) + ' ' + n(cy + ry * 0.18) +
        ' C' + n(cx - rx * 1.02) + ' ' + n(cy - ry * 0.55) + ' ' + n(cx - rx * 0.28) + ' ' + n(cy - ry * 0.95) + ' ' + n(cx) + ' ' + n(cy - ry - 13 * s) + ' Z', paint('body')));
    } else {
      out.push(ell(cx, cy, rx, ry, paint('body')));
    }
    if (species === 'blob' && stage >= 2) {
      out.push(circ(cx - 5 * s, cy - ry - 1 * s, 4.5 * s, paint('body')), circ(cx + 2 * s, cy - ry - 4 * s, 5.5 * s, paint('body')), circ(cx + 8 * s, cy - ry, 4 * s, paint('body')));
    }
    if (stage >= 5) { // crown
      var top = cy - ry - crownLift(species) * s, w2 = 13 * s;
      out.push(path('M' + n(cx - w2) + ' ' + n(top + 9 * s) + ' L' + n(cx - w2) + ' ' + n(top - 3 * s) + ' L' + n(cx - w2 / 2) + ' ' + n(top + 3 * s) + ' L' + n(cx) + ' ' + n(top - 7 * s) +
        ' L' + n(cx + w2 / 2) + ' ' + n(top + 3 * s) + ' L' + n(cx + w2) + ' ' + n(top - 3 * s) + ' L' + n(cx + w2) + ' ' + n(top + 9 * s) + ' Z', paint('crown')));
    }
    return out.join('');
  }
  function crownLift(species) { return { bun: 24, drop: 18, sprout: 22, kitty: 15, dragon: 13 }[species] || 9; }
  function leaf(x, y, size, dir) {
    var ex = x + dir * size, ey = y - size * 0.45;
    return 'M' + n(x) + ' ' + n(y) + ' Q' + n(x + dir * size * 0.5) + ' ' + n(y - size * 0.95) + ' ' + n(ex) + ' ' + n(ey) + ' Q' + n(x + dir * size * 0.55) + ' ' + n(y + size * 0.15) + ' ' + n(x) + ' ' + n(y) + ' Z';
  }
  function face(stage, g, mood, colour) {
    var s = g.s, cx = g.cx, cy = g.cy, out = [], er = (stage === 1 ? 7.2 : 6) * s, ey = cy - 4 * s, gap = (stage === 1 ? 10 : 11.5) * s;
    if (mood === 'cheer') {
      [-1, 1].forEach(function (d) { out.push(path('M' + n(cx + d * gap - er) + ' ' + n(ey + 1) + ' Q' + n(cx + d * gap) + ' ' + n(ey - er * 1.3) + ' ' + n(cx + d * gap + er) + ' ' + n(ey + 1), 'none', ' stroke="' + INK + '" stroke-width="' + n(2.6 * s) + '" stroke-linecap="round"')); });
      out.push(path('M' + n(cx - 7 * s) + ' ' + n(cy + 6 * s) + ' Q' + n(cx) + ' ' + n(cy + 17 * s) + ' ' + n(cx + 7 * s) + ' ' + n(cy + 6 * s) + ' Z', '#7b2c3b'));
      out.push(ell(cx, cy + 11.5 * s, 3.6 * s, 2.2 * s, '#ff8fa3'));
    } else {
      [-1, 1].forEach(function (d) {
        out.push(circ(cx + d * gap, ey, er, '#ffffff'), circ(cx + d * gap + 0.6 * s, ey + 0.8 * s, er * 0.62, INK), circ(cx + d * gap + 2 * s, ey - 1.6 * s, er * 0.24, '#ffffff'));
      });
      out.push(path('M' + n(cx - 6 * s) + ' ' + n(cy + 7 * s) + ' Q' + n(cx) + ' ' + n(cy + 12.5 * s) + ' ' + n(cx + 6 * s) + ' ' + n(cy + 7 * s), 'none', ' stroke="' + INK + '" stroke-width="' + n(2.3 * s) + '" stroke-linecap="round"'));
    }
    if (stage >= 3) { out.push(ell(cx - 17 * s, cy + 5 * s, 4.6 * s, 3 * s, '#ff6f8f', ' opacity=".45"'), ell(cx + 17 * s, cy + 5 * s, 4.6 * s, 3 * s, '#ff6f8f', ' opacity=".45"')); }
    return out.join('');
  }
  function sparkle(x, y, r, fill) {
    return path('M' + n(x) + ' ' + n(y - r) + ' Q' + n(x + r * 0.18) + ' ' + n(y - r * 0.18) + ' ' + n(x + r) + ' ' + n(y) + ' Q' + n(x + r * 0.18) + ' ' + n(y + r * 0.18) + ' ' + n(x) + ' ' + n(y + r) +
      ' Q' + n(x - r * 0.18) + ' ' + n(y + r * 0.18) + ' ' + n(x - r) + ' ' + n(y) + ' Q' + n(x - r * 0.18) + ' ' + n(y - r * 0.18) + ' ' + n(x) + ' ' + n(y - r) + ' Z', fill);
  }

  /* opts: {creature, stage (0-5), mood: 'happy'|'cheer', label, uid (unique per page), crack (0-1: how cracked an egg is)} */
  function creatureSvg(opts) {
    opts = opts || {};
    var p = creatureParts(opts.creature), c = COLOURS.filter(function (x) { return x[0] === p.colour; })[0];
    var stage = Math.max(0, Math.min(5, Math.floor(Number(opts.stage) || 0))), uid = String(opts.uid || 'c').replace(/[^A-Za-z0-9_-]/g, '');
    var label = String(opts.label || '').replace(/[&<>"]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; });
    var out = ['<svg class="pc-creature pc-stage-' + stage + '" viewBox="0 0 120 120" role="img"' + (label ? ' aria-label="' + label + '"' : ' aria-hidden="true"') + ' focusable="false">'];
    if (stage >= 5) {
      out.push('<defs><radialGradient id="pc-aura-' + uid + '"><stop offset="0" stop-color="#ffe27a" stop-opacity=".85"/><stop offset=".55" stop-color="#ffd23f" stop-opacity=".35"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></radialGradient></defs>');
      out.push(circ(60, 62, 58, 'url(#pc-aura-' + uid + ')'));
    }
    out.push(ell(60, 110, stage === 0 ? 20 : 27, 4.5, '#000000', ' opacity=".12"'));
    if (stage === 0) {
      var egg = function (fill, extra) { return ell(60, 70, 27, 34, fill, extra); };

    if (mine.careDay && mine.careDay.studentId === me.studentId && mine.careDay.day === today) return;
    mine.careDay = {studentId: me.studentId, day: today}; save(mine);
    if (!row) return;
    var text = 'All four cares done today! ' + kind.name + ' is glowing.', line = h('p', {class: 'sp-care-all', role: 'status', text: text});
    row.querySelectorAll('.sp-care-all').forEach(function (x) { x.remove(); });
    row.prepend(line); say(text);
    if (card && !reduceMotion()) { card.classList.remove('sp-care-glow'); void card.offsetWidth; card.classList.add('sp-care-glow'); }
    wobble(app.querySelector('.sp-companion .sp-egg-btn'));
    setTimeout(function () { if (line.isConnected) line.remove(); if (card) card.classList.remove('sp-care-glow'); }, 6000);
  }
  function signOut() { ++S.request; S.busy = false; clearAvatarDraft(); var m = saved(); delete m.session; delete m.studentId; save(m); S.board = null; loadRoster(); }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.board && !S.busy && Date.now() - S.loadedAt > 60000 && app.querySelector('.sp-castle')) loadBoard(); });
  start();
})();

</script>
